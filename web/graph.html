<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>法規關聯圖譜 - 歲計會計隨身法典</title>
    <meta name="description" content="互動式中華民國歲計會計法規交叉引用圖譜，視覺化憲法、預算法、決算法、會計法及相關法規條文關聯性。">
    <link rel="icon" href="icon-192.png">
    <script>
        try {
            const theme = JSON.parse(localStorage.getItem("theme"));
            if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="mobile-backdrop" id="mobile-backdrop"></div>

        <!-- Sidebar: Controls & Stats -->
        <aside class="sidebar-left" id="sidebar-left">
            <header class="app-header">
                <div class="header-top">
                    <div class="logo">
                        <span class="logo-icon">🔗</span>
                        <h1>法規關聯圖譜</h1>
                    </div>
                    <div class="header-actions">
                        <button class="icon-btn" type="button" id="graph-theme-btn" title="切換深淺色" aria-label="切換深淺色">◐</button>
                        <button class="icon-btn" type="button" id="close-mobile-sidebar" aria-label="關閉側欄" style="display:none;">×</button>
                    </div>
                </div>
                <p class="subtitle">
                    <a href="index.html">← 返回隨身法典</a>
                    <span>·</span>
                    <span id="active-scope-label">預設：主計三法</span>
                </p>
            </header>

            <!-- KPI Card Grid -->
            <section class="kpi-container" aria-label="目前圖譜統計">
                <div class="kpi-card">
                    <span class="kpi-val" id="kpi-nodes">0</span>
                    <span class="kpi-label">顯示條文節點</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-val" id="kpi-edges">0</span>
                    <span class="kpi-label">顯示引用連線</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-val" id="kpi-laws">0</span>
                    <span class="kpi-label">顯示法規數</span>
                </div>
                <div class="kpi-card highlight">
                    <span class="kpi-val" id="kpi-review">0</span>
                    <span class="kpi-label">顯示中需複核</span>
                </div>
            </section>

            <!-- Search, Presets & Filters -->
            <section class="filters-container">
                <div class="filter-group">
                    <span class="group-title">快速檢視範圍</span>
                    <div class="preset-grid">
                        <button type="button" class="preset-btn active" data-preset="triad">主計三法</button>
                        <button type="button" class="preset-btn" data-preset="core">核心主計法規</button>
                        <button type="button" class="preset-btn" data-preset="connected">全部有引用</button>
                        <button type="button" class="preset-btn" data-preset="review">僅需人工複核</button>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="search-input">搜尋條文內容、法規或條號</label>
                    <div class="search-wrapper">
                        <input class="text-input" type="text" id="search-input" placeholder="例如：預算法 62、決算、流用">
                        <button id="clear-search" class="clear-btn" aria-label="清除搜尋">&times;</button>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-group-head">
                        <label for="law-filter-search">篩選法規範疇</label>
                        <div class="mini-actions">
                            <button type="button" class="mini-btn" id="laws-all">全選</button>
                            <button type="button" class="mini-btn" id="laws-none">全不選</button>
                            <button type="button" class="mini-btn" id="laws-connected">僅有引用</button>
                        </div>
                    </div>
                    <input class="text-input" type="search" id="law-filter-search" placeholder="篩選法規清單名稱…" aria-label="篩選法規清單名稱">
                    <div class="checkbox-list" id="law-filters"></div>
                </div>

                <div class="filter-group">
                    <span class="group-title">連線與節點屬性</span>
                    <div class="toggle-list">
                        <label class="switch-container">
                            <input type="checkbox" id="toggle-connected" checked>
                            <span class="slider"></span>
                            <span class="switch-label">僅顯示有引用關聯的條文</span>
                        </label>
                        <label class="switch-container">
                            <input type="checkbox" id="toggle-external" checked>
                            <span class="slider"></span>
                            <span class="switch-label">跨法規引用 (external)</span>
                        </label>
                        <label class="switch-container">
                            <input type="checkbox" id="toggle-internal" checked>
                            <span class="slider"></span>
                            <span class="switch-label">本法內部引用 (internal)</span>
                        </label>
                        <label class="switch-container">
                            <input type="checkbox" id="toggle-needs-review">
                            <span class="slider warning"></span>
                            <span class="switch-label warning-text">僅顯示需人工複核</span>
                        </label>
                    </div>
                </div>
            </section>

            <footer class="sidebar-footer">
                <p id="graph-dataset-summary">資料來源：法務部全國法規資料庫 / 主計總處</p>
                <p>點擊節點檢視全文與引用，雙擊或拖曳可微調位置</p>
            </footer>
        </aside>

        <!-- Main Workspace: The Graph Visualization -->
        <main class="main-workspace" id="graph-workspace">
            <div class="mobile-bar">
                <button type="button" class="mobile-pill" id="open-mobile-sidebar">☰ 篩選與範圍</button>
                <a class="mobile-pill" href="index.html">← 隨身法典</a>
            </div>

            <div class="graph-status-overlay" id="graph-status">
                <div class="status-card">
                    <strong>正在載入法規關聯資料…</strong>
                    <span style="font-size:13px; color:var(--text-secondary);">請稍候，正在建立條文引用網路</span>
                </div>
            </div>

            <!-- Canvas HUD Controls -->
            <div class="hud-controls">
                <button id="zoom-in" type="button" title="放大" aria-label="放大">+</button>
                <button id="zoom-out" type="button" title="縮小" aria-label="縮小">−</button>
                <button id="zoom-fit" type="button" title="最適大小" aria-label="最適大小">⛶</button>
            </div>

            <div class="svg-container" id="svg-container"></div>

            <!-- Collapsible Legend -->
            <details class="legend-overlay" id="legend-overlay" open>
                <summary>圖例說明</summary>
                <div class="legend-body">
                    <div class="legend-items" id="legend-items"></div>
                    <div class="legend-divider"></div>
                    <div class="legend-types">
                        <div class="legend-type"><span class="line-style solid"></span>絕對引用</div>
                        <div class="legend-type"><span class="line-style dashed"></span>相對引用（前條／次條）</div>
                        <div class="legend-type"><span class="node-style warning-ring"></span>含需複核引用</div>
                    </div>
                </div>
            </details>
        </main>

        <!-- Sidebar Right: Inspector Panel -->
        <aside class="sidebar-right collapsed" id="inspector-panel" aria-label="條文詳細檢視">
            <button class="close-inspector-btn" id="close-inspector" type="button" title="關閉條文面板" aria-label="關閉條文面板">&times;</button>
            <div class="inspector-content">
                <div class="inspector-header">
                    <span class="law-badge" id="insp-law-badge">BUDGET</span>
                    <h2 id="insp-title">條文標題</h2>
                    <p class="law-fullname" id="insp-law-fullname">預算法</p>
                    <div class="insp-actions">
                        <a class="insp-btn primary" id="insp-codex-link" href="index.html">📖 在隨身法典開啟</a>
                        <button class="insp-btn" type="button" id="insp-copy">複製公文引用</button>
                        <button class="insp-btn" type="button" id="btn-focus-ego" aria-pressed="false">只看此條鄰居</button>
                    </div>
                </div>

                <div class="inspector-section">
                    <h3>法條本文</h3>
                    <div class="article-text-container">
                        <p id="insp-text" class="article-text">點擊圖譜中的任何節點以檢視詳細法條內容與交叉引用關係。</p>
                    </div>
                </div>

                <div class="inspector-section tabs">
                    <div class="tab-headers">
                        <button class="tab-btn active" type="button" data-tab="outgoing">向外引用 (<span id="insp-out-count">0</span>)</button>
                        <button class="tab-btn" type="button" data-tab="incoming">被此引用 (<span id="insp-in-count">0</span>)</button>
                    </div>

                    <div class="tab-content active" id="tab-outgoing">
                        <ul class="citation-list" id="insp-outgoing-list"></ul>
                    </div>

                    <div class="tab-content" id="tab-incoming">
                        <ul class="citation-list" id="insp-incoming-list"></ul>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
