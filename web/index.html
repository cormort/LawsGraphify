<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script>
    // Apply saved theme / font size before first paint
    try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme) document.documentElement.dataset.theme = theme;
        const fs = JSON.parse(localStorage.getItem("fontSize"));
        if (fs) document.documentElement.style.setProperty("--fs", fs + "px");
    } catch (e) {}
</script>
<style>
:root {
    --fs: 17px;
    --bg: #f7f7f5; --surface: #ffffff; --border: #e3e2de;
    --text: #1f2328; --muted: #6a6f76; --accent: #3b5bdb; --accent-soft: #edf2ff;
    --warn: #b35c00; --warn-soft: #fff4e5; --mark: #fff3bf;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #111317; --surface: #1a1d23; --border: #2c3038;
        --text: #e6e8eb; --muted: #9aa1ab; --accent: #8ea8ff; --accent-soft: #1f2740;
        --warn: #ffb057; --warn-soft: #33260f; --mark: #4a3f10;
    }
}
:root[data-theme="dark"] {
    --bg: #111317; --surface: #1a1d23; --border: #2c3038;
    --text: #e6e8eb; --muted: #9aa1ab; --accent: #8ea8ff; --accent-soft: #1f2740;
    --warn: #ffb057; --warn-soft: #33260f; --mark: #4a3f10;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font: var(--fs)/1.75 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }

/* Sticky top bar: brand, tools, search */
.topbar {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: max(8px, env(safe-area-inset-top)) 16px 10px;
}
.topbar-inner, main, footer { max-width: 860px; margin: 0 auto; }
.brand-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brand { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
.tools { display: flex; gap: 6px; }
.tool {
    min-width: 40px; min-height: 36px; padding: 0 10px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
}
form { display: flex; gap: 8px; margin-top: 8px; }
input[type=search] {
    flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px;  /* 16px stops iOS zoom-on-focus */
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
}
input[type=search]:focus, .jump input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.go { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); font-size: 16px; }

main { padding: 16px 16px 96px; }
.muted { color: var(--muted); font-size: 0.85em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
h2 { font-size: 1.15em; margin: 0 0 4px; line-height: 1.5; }
h3 { font-size: 0.9em; margin: 24px 0 8px; color: var(--muted); font-weight: 600; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 0.9em; }
.empty { color: var(--muted); }
.text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

.star { flex: none; border: 0; background: none; font-size: 1.4em; line-height: 1; padding: 4px; color: var(--muted); }
.star[aria-pressed="true"] { color: #f2b705; }
.hit-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hit-head > a:first-child { font-weight: 600; text-decoration: none; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#update-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 16px 0; }
#update-bar[hidden] { display: none; }
#update-bar span { flex: 1 1 12em; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-decoration: none; }
.badge.review { background: var(--warn-soft); color: var(--warn); }

a.cite { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
a.cite.focus { background: var(--mark); border-radius: 3px; text-decoration: none; }
.cite-unresolved { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }

/* Lists: laws, favourites, recents, cited articles */
.list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--text); }
.list > :first-child { border-top: 0; padding-top: 0; }
.list .count { color: var(--muted); font-size: 0.85em; white-space: nowrap; }
details > summary { cursor: pointer; list-style: none; font-weight: 600; padding: 4px 0; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; color: var(--muted); }
details[open] > summary::before { content: "▾ "; }
details.card[open] > summary { margin-bottom: 8px; }

.article-nav { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 0.9em; }
.article-nav a { text-decoration: none; padding: 6px 0; }
.law-article { padding: 14px 0; border-top: 1px solid var(--border); scroll-margin-top: 140px; }
.law-article:first-child { border-top: 0; padding-top: 0; }
.chapter { margin: 18px 0 4px; font-weight: 700; color: var(--accent); scroll-margin-top: 140px; }
.chapter:first-child { margin-top: 0; }
#full-text.only-cited .law-article:not(.is-cited), #full-text.only-cited .chapter { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; font-size: 0.9em; }
.jump { display: flex; align-items: center; gap: 6px; margin: 0; }
.jump input { width: 4.5em; font-size: 16px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
.toc { margin-top: 10px; }
.toc button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border); padding: 10px 0; color: var(--accent); font-size: 0.9em; }

#to-top {
    position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 18px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
    display: none;
}
footer { padding: 0 16px max(24px, env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); }
footer a { color: var(--muted); }
.offline-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
</style>
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand-row">
            <a class="brand" href="#">📖 隨身法典</a>
            <div class="tools">
                <button class="tool" type="button" data-font="-1" aria-label="縮小字體">A−</button>
                <button class="tool" type="button" data-font="1" aria-label="放大字體">A＋</button>
                <button class="tool" type="button" id="theme-btn" aria-label="切換深淺色">◐</button>
                <button class="tool" type="button" id="install-btn" hidden>安裝</button>
            </div>
        </div>
        <form id="query-form" role="search">
            <input id="q" type="search" list="law-names" autocomplete="off" enterkeyhint="search"
                   placeholder="法規名稱、條號或關鍵字" aria-label="法規名稱、條號或關鍵字">
            <datalist id="law-names"></datalist>
            <button class="go" type="submit">查詢</button>
        </form>
    </div>
</header>

<div id="update-bar" class="warn" role="alert" hidden><span></span>
    <button type="button" id="update-yes">下載</button> <button type="button" id="update-no">稍後</button></div>
<main id="result" aria-live="polite"><p class="empty">資料載入中…</p></main>

<footer>
    <p><span id="data-info"></span> <span id="offline-info"></span></p>
    <p>條文來自法務部全國法規資料庫與行政院主計總處主管法規共用系統；引用關係由程式自動解析，正式用途請以原文為準。
       · <a href="graph.html">關聯圖</a> · <a href="https://github.com/cormort/LawsGraphify">原始碼</a></p>
</footer>
<button id="to-top" type="button" aria-label="回到頂端">↑</button>

<script>
let nodes = new Map();      // id -> node
let incoming = new Map();   // target id -> [edge]
let outgoing = new Map();   // source id -> [edge]
let lawOrder = new Map();   // code -> [article ids in order]
let laws = [];              // [{code, name, kind, count}]
let nameToCode = {};        // normalized name -> code
let codeToName = {};        // code -> display name
let sortedNames = [];       // names, longest first
const scrollPositions = new Map();  // hash -> scrollY, restored on back

const MAX_RESULTS = 200;

// localStorage can throw (private mode) or be empty; the app works without it
const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
};

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
}

// "六十二" / "一百十" / "62" -> number (same rules as citation_resolver.chinese_to_arabic)
function toNumber(s) {
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    const digits = { 零: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
    const units = { 十: 10, 百: 100, 千: 1000 };
    let total = 0, digit = 0;
    for (const ch of s) {
        if (ch in digits) digit = digits[ch];
        else if (ch in units) { total += (digit || 1) * units[ch]; digit = 0; }
    }
    return total + digit;
}

function nodeId(code, main, sub) {
    return `${code}-${String(main).padStart(4, "0")}` + (sub ? `-${String(sub).padStart(3, "0")}` : "");
}

function articleLabel(id) {
    const node = nodes.get(id);
    if (node) return node.article_zh;
    const [, main, sub] = id.match(/-(\d{4})(?:-(\d{3}))?$/) || [];
    return main ? `第 ${+main}${sub ? "-" + +sub : ""} 條` : id;
}

function lawName(code) { return codeToName[code] || code; }
function codeOf(id) { return id.replace(/-\d{4}(-\d{3})?$/, ""); }
// 行政規則 number by 點, laws by 條
function unit(code) { return nodes.get(lawOrder.get(code)?.[0])?.article_zh.includes("點") ? "點" : "條"; }
function citerCount(id) { return new Set((incoming.get(id) || []).map(e => e.source)).size; }
function label(id) { return /-\d{4}/.test(id) ? `${lawName(codeOf(id))} ${articleLabel(id)}` : lawName(id); }
function link(id, text) { return `<a href="#${encodeURIComponent(id)}">${escapeHtml(text ?? label(id))}</a>`; }

const NUM = "[0-9零一二三四五六七八九十百千兩]+";
const ARTICLE_PAT = new RegExp(`^第?(${NUM})[條點]?(?:[之\\-](${NUM}))?[條點]?$`);

// Free text -> {type: "article"|"law"|"search", ...}
function parseQuery(raw) {
    const text = raw.normalize("NFKC").trim();
    if (!text) return null;
    const compact = text.replace(/\s+/g, "");
    const direct = compact.toUpperCase().match(/^([A-Z0-9]+)-(\d{1,4})(?:-(\d{1,3}))?$/);
    if (direct && codeToName[direct[1]]) {
        return { type: "article", code: direct[1], main: +direct[2], sub: direct[3] ? +direct[3] : null };
    }
    const name = sortedNames.find(n => compact.includes(n));
    if (!name) return { type: "search", code: null, ...terms(text) };

    const code = nameToCode[name];
    const rest = (text.includes(name) ? text.replace(name, " ") : compact.replace(name, " ")).trim();
    if (!rest) return { type: "law", code };
    const m = rest.replace(/\s+/g, "").match(ARTICLE_PAT);
    if (m) return { type: "article", code, main: toNumber(m[1]), sub: m[2] ? toNumber(m[2]) : null };
    return { type: "search", code, ...terms(rest) };
}

// "流用 預備金 -特別" -> include all of [流用, 預備金], exclude [特別]
function terms(text) {
    const words = text.split(/\s+/).filter(Boolean);
    return {
        include: words.filter(w => !w.startsWith("-")),
        exclude: words.filter(w => w.startsWith("-") && w.length > 1).map(w => w.slice(1)),
    };
}

// Article text with each citation as a link; citations of focusId are marked
function linkify(node, focusId) {
    const text = node.text || "";
    const bySpan = new Map();  // "a,b" -> targets (a range has several)
    for (const e of outgoing.get(node.id) || []) {
        for (const [a, b] of e.spans || []) {
            const key = `${a},${b}`;
            if (!bySpan.has(key)) bySpan.set(key, { a, b, targets: [] });
            bySpan.get(key).targets.push(e.target);
        }
    }
    let html = "", pos = 0;
    for (const { a, b, targets } of [...bySpan.values()].sort((x, y) => x.a - y.a)) {
        if (a < pos) continue;  // overlapping span: keep the first
        html += escapeHtml(text.slice(pos, a));
        const words = escapeHtml(text.slice(a, b));
        const known = targets.filter(Boolean);
        if (!known.length) {
            html += `<span class="cite-unresolved" title="引用的法規未收錄">${words}</span>`;
        } else {
            const title = known.map(label).join("、");
            const focus = focusId && known.includes(focusId) ? " focus" : "";
            html += `<a class="cite${focus}" href="#${encodeURIComponent(known[0])}" title="${escapeHtml(title)}">${words}</a>`;
        }
        pos = b;
    }
    return html + escapeHtml(text.slice(pos));
}

function starButton(id) {
    const on = store.get("favs", []).includes(id);
    return `<button class="star" type="button" data-fav="${escapeHtml(id)}" aria-pressed="${on}"
        aria-label="${on ? "取消收藏" : "加入收藏"}">${on ? "★" : "☆"}</button>`;
}

function edgeBadges(edges) {
    const subRefs = [...new Set(edges.map(e => e.sub_ref).filter(Boolean))];
    const badges = subRefs.map(s => `<span class="badge">${escapeHtml(s)}</span>`);
    if (edges.some(e => e.kind === "relative")) badges.push(`<span class="badge">相對引用</span>`);
    const review = edges.filter(e => e.needs_review);
    if (review.length) {
        const pct = Math.round(Math.min(...review.map(e => e.confidence)) * 100);
        badges.push(`<span class="badge review">需複核 ${pct}%</span>`);
    }
    return badges.join("");
}

function groupBySource(edges) {
    const groups = new Map();
    edges.forEach(e => groups.set(e.source, [...(groups.get(e.source) || []), e]));
    return [...groups.values()];
}

function rememberRecent(id) {
    const recents = store.get("recents", []).filter(x => x !== id);
    store.set("recents", [id, ...recents].slice(0, 10));
}

// --- Views ---

function renderHome() {
    const known = id => nodes.has(id) || lawOrder.has(id);
    const favs = store.get("favs", []).filter(known);
    const recents = store.get("recents", []).filter(known);
    let html = `<p class="muted">點法規看全文，條文中的引用可以點擊跳轉。也可以輸入條號（預算法第62條）或關鍵字（預算法 流用）。</p>`;
    if (favs.length) html += `<h3>★ 收藏</h3><div class="card list">${favs.map(id => link(id)).join("")}</div>`;
    if (recents.length) html += `<h3>最近查看</h3><div class="card list">${recents.map(id => link(id)).join("")}</div>`;
    const kinds = [...new Set(laws.map(l => l.kind))];
    html += `<h3>法規（${laws.length} 部）</h3>`;
    html += kinds.map(kind => {
        const group = laws.filter(l => l.kind === kind);
        return `<details class="card" open><summary>${escapeHtml(kind)}（${group.length}）</summary>
            <div class="list">${group.map(l => `<a href="#${encodeURIComponent(l.code)}">
                <span>${escapeHtml(l.name)}</span><span class="count">${l.count} ${unit(l.code)}</span></a>`).join("")}</div></details>`;
    }).join("");
    return html;
}

function renderArticle(q) {
    const id = nodeId(q.code, q.main, q.sub);
    const target = nodes.get(id);
    const lawHasText = lawOrder.has(q.code);
    let html = "";

    if (lawHasText) {
        const order = lawOrder.get(q.code), i = order.indexOf(id);
        const step = (t, txt) => t ? link(t, txt) : `<span class="muted">${txt}</span>`;
        html += `<nav class="article-nav">${link(q.code, `← 《${lawName(q.code)}》全文`)}
            <span>${step(order[i - 1], "‹ 上一條")}　${step(order[i + 1], "下一條 ›")}</span></nav>`;
    }
    html += `<div class="card"><div class="title-row"><h2>${escapeHtml(label(id))}</h2>${target ? starButton(id) : ""}</div>`;
    if (target) {
        if (target.chapter) html += `<p class="muted">${escapeHtml(target.chapter)}</p>`;
        html += `<p class="text">${linkify(target)}</p>`;
        rememberRecent(id);
    } else if (lawHasText) {
        html += `<div class="warn">資料中沒有這一條（可能已刪除、改條號，或條號輸入錯誤）。${incoming.has(id) ? "下面的引用可能已經失效。" : ""}</div>`;
    } else {
        html += `<p class="muted">這部法規沒有收錄全文，只列出引用它的條文。</p>`;
    }

    const bySource = groupBySource(incoming.get(id) || []);
    html += `</div><h3>被 ${bySource.length} 條條文引用</h3>`;
    if (!bySource.length) return html + `<p class="empty">沒有其他條文引用這一條。</p>`;
    // Other laws first, then the same law; each in article order
    const own = sid => sid.startsWith(q.code + "-");
    bySource.sort((a, b) => (own(a[0].source) - own(b[0].source)) || a[0].source.localeCompare(b[0].source));
    return html + bySource.map(group => {
        const src = nodes.get(group[0].source);
        return `<div class="card"><div class="hit-head">${link(src.id)}<div class="badges">${edgeBadges(group)}${starButton(src.id)}</div></div>
            <p class="text">${linkify(src, id)}</p></div>`;
    }).join("");
}

// Whole law: table of contents, jump box, full text with live citations
function renderFullText(code) {
    const ids = lawOrder.get(code);
    const cited = ids.filter(id => citerCount(id)).length;
    const chapters = ids.filter(id => nodes.get(id).chapter);
    rememberRecent(code);

    let html = `<div class="card"><div class="title-row"><h2>${escapeHtml(lawName(code))}</h2>${starButton(code)}</div>
        <p class="muted">共 ${ids.length} ${unit(code)}，${cited} ${unit(code)}被其他條文引用</p>
        <div class="controls">
            <form class="jump" data-law="${escapeHtml(code)}">跳至 <input name="n" inputmode="numeric" enterkeyhint="go" aria-label="條號"> ${unit(code)}</form>
            <label><input type="checkbox" id="only-cited"> 只看被引用的</label>
        </div>`;
    if (chapters.length) {
        html += `<details class="toc"><summary>目錄（${chapters.length} 章）</summary>
            ${chapters.map(id => `<button type="button" data-scroll="ch-${escapeHtml(id)}">${escapeHtml(nodes.get(id).chapter)}</button>`).join("")}</details>`;
    }
    html += `</div><div class="card" id="full-text">`;
    html += ids.map(id => {
        const node = nodes.get(id), n = citerCount(id);
        const chapter = node.chapter ? `<div class="chapter" id="ch-${escapeHtml(id)}">${escapeHtml(node.chapter)}</div>` : "";
        return `${chapter}<article class="law-article${n ? " is-cited" : ""}" id="a-${escapeHtml(id)}">
            <div class="hit-head">${link(id, node.article_zh)}<div class="badges">
                ${n ? `<a class="badge" href="#${encodeURIComponent(id)}">被 ${n} 條引用</a>` : ""}${starButton(id)}</div></div>
            <p class="text">${linkify(node)}</p></article>`;
    }).join("");
    return html + `</div>`;
}

// Law without full text (external): which of its articles are cited
function renderCitedList(code) {
    const cited = [...incoming.keys()].filter(id => id.startsWith(code + "-")).sort();
    return `<div class="card"><h2>${escapeHtml(lawName(code))}</h2>
        <p class="muted">這部法規沒有收錄全文，以下是被引用的條文。</p></div>`
        + (cited.length ? `<div class="card list">${cited.map(id => `<a href="#${encodeURIComponent(id)}">
            <span>${escapeHtml(articleLabel(id))}</span><span class="count">${citerCount(id)} 處</span></a>`).join("")}</div>` : "");
}

// Keyword search (all laws, or one law): every include term, no exclude term
function renderSearch(q) {
    if (!q.include.length) return `<p class="warn">請輸入要搜尋的關鍵字。</p>`;
    const scope = q.code ? lawOrder.get(q.code) || [] : [...nodes.keys()];
    const hits = scope.filter(id => {
        const t = nodes.get(id).norm;
        return q.include.every(w => t.includes(w)) && !q.exclude.some(w => t.includes(w));
    });
    const where = q.code ? `《${lawName(q.code)}》` : "全部法規";
    let html = `<h3>在${escapeHtml(where)}中找到 ${hits.length} 條「${escapeHtml(q.include.join(" "))}」${q.exclude.length ? `（排除 ${escapeHtml(q.exclude.join("、"))}）` : ""}</h3>`;
    if (!hits.length) return html + `<p class="empty">沒有符合的條文。${q.code ? "" : "要查法規請輸入完整名稱，例如「預算法」。"}</p>`;
    html += hits.slice(0, MAX_RESULTS).map(id =>
        `<div class="card"><div class="hit-head">${link(id)}${starButton(id)}</div><p class="text">${snippet(nodes.get(id), q.include)}</p></div>`
    ).join("");
    if (hits.length > MAX_RESULTS) html += `<p class="muted">只顯示前 ${MAX_RESULTS} 條，請加關鍵字縮小範圍。</p>`;
    return html;
}

// ~160 characters around the first hit, every term marked
function snippet(node, words) {
    const text = node.text;  // same length as node.norm
    const first = Math.min(...words.map(w => node.norm.indexOf(w)).filter(i => i >= 0));
    const start = Math.max(0, first - 60), end = Math.min(text.length, first + 100);
    let html = (start ? "…" : "") + escapeHtml(text.slice(start, end)) + (end < text.length ? "…" : "");
    for (const w of words) {
        const escaped = escapeHtml(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        html = html.replace(new RegExp(escaped, "g"), "<mark>$&</mark>");
    }
    return html;
}

function render(raw) {
    const result = document.getElementById("result");
    const q = parseQuery(raw);
    if (!q) result.innerHTML = renderHome();
    else if (q.type === "article") result.innerHTML = renderArticle(q);
    else if (q.type === "law") result.innerHTML = lawOrder.has(q.code) ? renderFullText(q.code) : renderCitedList(q.code);
    else result.innerHTML = renderSearch(q);
    return q;
}

function runFromHash() {
    const raw = decodeURIComponent(location.hash.slice(1));
    const q = render(raw);
    // Show "預算法 第 32 條" rather than the internal id a link carried
    document.getElementById("q").value = !q ? "" : q.type === "article"
        ? label(nodeId(q.code, q.main, q.sub)) : q.type === "law" ? lawName(q.code) : raw;
    window.scrollTo(0, scrollPositions.get(location.hash) || 0);
}

// --- Data & wiring ---

// Law texts live in their own cache, one file per law. The first visit downloads
// them all; later visits compare laws/index.json hashes and ask before
// downloading only the laws that changed.
const DATA = "laws-data";

async function fetchOk(path) {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) throw new Error(`${path} ${response.status}`);
    return response;
}

// Everything is fetched before anything is written, so a dropped connection keeps the old data
async function download(cache, index, codes, removed = []) {
    const files = await Promise.all(codes.map(code => fetchOk(`laws/${code}.json`)));
    await Promise.all(files.map((file, i) => cache.put(`laws/${codes[i]}.json`, file)));
    await Promise.all(removed.map(code => cache.delete(`laws/${code}.json`)));
    await cache.put("laws/index.json", new Response(JSON.stringify(index)));
}

async function checkUpdates(cache, local) {
    const remote = await (await fetchOk("laws/index.json")).json();
    const had = new Map(local.laws.map(l => [l.code, l.hash]));
    const changed = remote.laws.filter(l => had.get(l.code) !== l.hash);
    const removed = local.laws.map(l => l.code).filter(code => !remote.laws.some(l => l.code === code));
    if (!changed.length && !removed.length) {
        if (JSON.stringify({ ...remote, built: 0 }) !== JSON.stringify({ ...local, built: 0 }))
            await download(cache, remote, []);  // aliases or dates only: nothing to ask about
        return;
    }
    const bar = document.getElementById("update-bar"), yes = document.getElementById("update-yes");
    const names = changed.map(l => l.name);
    bar.querySelector("span").textContent = `法規有更新：${names.slice(0, 3).join("、")}${names.length > 3 ? ` 等 ${names.length} 部` : ""}` +
        (removed.length ? `（另移除 ${removed.length} 部）` : "") + "，要下載嗎？";
    bar.hidden = false;
    document.getElementById("update-no").onclick = () => { bar.hidden = true; };
    yes.onclick = async () => {
        yes.disabled = true;
        yes.textContent = "下載中…";
        try {
            await download(cache, remote, changed.map(l => l.code), removed);
            location.reload();
        } catch {
            yes.disabled = false;
            yes.textContent = "重試";
        }
    };
}

async function loadData() {
    const cache = await caches.open(DATA);
    let index = await (await cache.match("laws/index.json"))?.json();
    if (index) {
        checkUpdates(cache, index).catch(() => {});  // offline: keep what we have
    } else {
        index = await (await fetchOk("laws/index.json")).json();
        await download(cache, index, index.laws.map(l => l.code));
    }
    const files = await Promise.all(index.laws.map(async l => (await cache.match(`laws/${l.code}.json`)).json()));
    return { ...index, nodes: files.flatMap(f => f.nodes), edges: files.flatMap(f => f.edges) };
}

async function init() {
    const data = await loadData();
    data.nodes.forEach(n => {
        // Half-width per character, keeping any character that would expand
        // ("︰" -> ".."), so search offsets line up with the original text
        n.norm = [...n.text].map(c => { const h = c.normalize("NFKC"); return h.length === c.length ? h : c; }).join("");
        nodes.set(n.id, n);
        if (!lawOrder.has(n.law_code)) lawOrder.set(n.law_code, []);
        lawOrder.get(n.law_code).push(n.id);
    });
    data.edges.forEach(e => {
        if (!outgoing.has(e.source)) outgoing.set(e.source, []);
        outgoing.get(e.source).push(e);
        if (!e.target) return;  // unresolved citations have nowhere to land
        if (!incoming.has(e.target)) incoming.set(e.target, []);
        incoming.get(e.target).push(e);
    });
    laws = data.laws || [];

    nameToCode = data.aliases || {};
    data.nodes.forEach(n => { nameToCode[n.law_name.normalize("NFKC")] = n.law_code; });
    // Display name: the law's own name if we have it, else its longest alias
    for (const [name, code] of Object.entries(nameToCode)) {
        if (name !== code && (!codeToName[code] || name.length > codeToName[code].length)) codeToName[code] = name;
    }
    data.nodes.forEach(n => { codeToName[n.law_code] = n.law_name; });
    sortedNames = Object.keys(nameToCode).sort((a, b) => b.length - a.length);

    document.getElementById("law-names").innerHTML = laws
        .map(l => `<option value="${escapeHtml(l.name)}">`).join("");
    document.getElementById("data-info").textContent =
        `${laws.length} 部法規、${nodes.size} 條條文 · 法務部資料 ${data.moj_updated || "—"} · 建置 ${data.built || ""}`;
    runFromHash();
}

document.getElementById("query-form").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("q");
    input.blur();  // close the phone keyboard
    location.hash = encodeURIComponent(input.value.trim());
});

window.addEventListener("hashchange", e => {
    scrollPositions.set(new URL(e.oldURL).hash, window.scrollY);
    runFromHash();
});

document.addEventListener("click", e => {
    const fav = e.target.closest("[data-fav]");
    if (fav) {
        const id = fav.dataset.fav, favs = store.get("favs", []);
        store.set("favs", favs.includes(id) ? favs.filter(x => x !== id) : [id, ...favs]);
        fav.outerHTML = starButton(id);
    }
    const scroll = e.target.closest("[data-scroll]");
    if (scroll) document.getElementById(scroll.dataset.scroll)?.scrollIntoView();  // instant: laws are long
    const font = e.target.closest("[data-font]");
    if (font) {
        const now = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 17;
        const size = Math.min(26, Math.max(14, now + 2 * font.dataset.font));
        document.documentElement.style.setProperty("--fs", size + "px");
        store.set("fontSize", size);
    }
});

document.addEventListener("change", e => {
    if (e.target.id === "only-cited") document.getElementById("full-text").classList.toggle("only-cited", e.target.checked);
});

// "跳至 N 條" inside a law's full text
document.addEventListener("submit", e => {
    const form = e.target.closest(".jump");
    if (!form) return;
    e.preventDefault();
    const m = form.n.value.normalize("NFKC").replace(/\s+/g, "").match(ARTICLE_PAT);
    const el = m && document.getElementById("a-" + nodeId(form.dataset.law, toNumber(m[1]), m[2] ? toNumber(m[2]) : null));
    if (el) {
        form.n.blur();
        el.scrollIntoView();
    } else {
        form.n.setCustomValidity("沒有這一條");
        form.n.reportValidity();
        form.n.setCustomValidity("");
    }
});

// Theme: auto -> light -> dark
const THEMES = [null, "light", "dark"];
document.getElementById("theme-btn").addEventListener("click", () => {
    const now = document.documentElement.dataset.theme || null;
    const next = THEMES[(THEMES.indexOf(now) + 1) % THEMES.length];
    if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
    store.set("theme", next);
});

const toTop = document.getElementById("to-top");
window.addEventListener("scroll", () => { toTop.style.display = window.scrollY > 600 ? "block" : "none"; }, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

// Install: Chrome / Edge / Android offer a prompt; iPhone Safari has none, so explain the steps
const installBtn = document.getElementById("install-btn");
let installPrompt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
installBtn.hidden = standalone || !iOS;
window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;
    installBtn.hidden = false;
});
window.addEventListener("appinstalled", () => { installBtn.hidden = true; });
installBtn.addEventListener("click", async () => {
    if (!installPrompt) {
        alert("用 Safari 開啟本頁，點下方「分享」→「加入主畫面」，即可像 App 一樣離線使用。");
        return;
    }
    installPrompt.prompt();
    if ((await installPrompt.userChoice).outcome === "accepted") installBtn.hidden = true;
    installPrompt = null;
});

// Offline: cache the app and data on the phone
function showOnline() {
    const info = document.getElementById("offline-info");
    if (!navigator.onLine) info.innerHTML = `<span class="offline-pill">離線中</span>`;
    else if (navigator.serviceWorker?.controller) info.textContent = "· ✓ 已可離線使用";
    else info.textContent = "";
}
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(showOnline).catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", showOnline);
}
window.addEventListener("online", showOnline);
window.addEventListener("offline", showOnline);
showOnline();

init().catch(err => {
    document.getElementById("result").innerHTML =
        `<p class="warn">讀不到法規資料（${escapeHtml(err.message)}）。請在專案目錄執行 <code>python3 run_server.py</code> 再開啟。</p>`;
});
