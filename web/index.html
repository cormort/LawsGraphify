<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>歲計會計隨身法典</title>
<meta name="description" content="歲計會計法規全文、條文互連與引用查詢，可離線使用。">
<meta name="theme-color" content="#2b4acb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="隨身法典">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
    // Apply saved theme / font size before first paint
    try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme) document.documentElement.dataset.theme = theme;
        const fs = JSON.parse(localStorage.getItem("fontSize"));
        if (fs) document.documentElement.style.setProperty("--fs", fs + "px");
    } catch (e) {}
</script>
<link rel="stylesheet" href="codex.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand-row">
            <nav class="tabs" aria-label="法規分類">
                <a class="brand" href="#" data-tab="law"><span class="icon">📖 </span>主計法規</a>
                <a class="brand" href="#%E5%9F%BA%E9%87%91" data-tab="fund"><span class="icon">💰 </span>收支辦法</a>
                <a class="brand" href="#%E5%85%B6%E4%BB%96" data-tab="other"><span class="icon">📚 </span>其他</a>
            </nav>
            <div class="tools">
                <button class="tool" type="button" id="drawer-btn" aria-label="收藏與最近查看" aria-expanded="false" aria-controls="saved-drawer">
                    <span aria-hidden="true">★</span><span class="btn-label">收藏</span><span class="pill-count" id="fav-badge" hidden>0</span>
                </button>
                <div class="prefs-anchor">
                    <button class="tool" type="button" id="prefs-btn" aria-label="顯示設定與工具" aria-expanded="false" aria-controls="prefs-menu">Aa ▾</button>
                    <div id="prefs-menu" class="popover" role="region" aria-label="顯示設定與工具" hidden>
                        <div class="pref-row">
                            <span class="pref-label">字體大小</span>
                            <div class="pref-control">
                                <button class="tool" type="button" data-font="-1" aria-label="縮小字體">A−</button>
                                <span class="pref-val" id="font-display">17px</span>
                                <button class="tool" type="button" data-font="1" aria-label="放大字體">A＋</button>
                            </div>
                        </div>
                        <div class="pref-row">
                            <span class="pref-label">外觀主題</span>
                            <div class="seg-group" role="group" aria-label="外觀主題">
                                <button class="seg-btn" type="button" data-theme-opt="auto" aria-pressed="true">自動</button>
                                <button class="seg-btn" type="button" data-theme-opt="light" aria-pressed="false">淺色</button>
                                <button class="seg-btn" type="button" data-theme-opt="dark" aria-pressed="false">深色</button>
                            </div>
                        </div>
                        <div class="pref-row" id="rate-row">
                            <span class="pref-label">朗讀速度</span>
                            <button class="tool" type="button" id="rate-btn" aria-label="切換朗讀速度"></button>
                        </div>
                        <div class="pref-links">
                            <a class="menu-link" href="graph.html"><span>🔗 法規關聯圖譜</span><span aria-hidden="true">↗</span></a>
                            <button class="menu-btn" type="button" id="install-btn" hidden><span>📲 安裝離線 App</span><span aria-hidden="true">→</span></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="search-wrap">
            <form id="query-form" role="search">
                <div class="search-box">
                    <button type="button" id="search-scope" class="scope-chip" hidden title="點擊取消範圍限制"></button>
                    <input id="q" type="search" autocomplete="off" enterkeyhint="search"
                           placeholder="輸入法規名稱、條號（如 預算法 62）或關鍵字" aria-label="法規名稱、條號或關鍵字">
                    <button type="button" id="q-clear" class="clear-x" aria-label="清除輸入" hidden>×</button>
                    <kbd class="kbd-hint" aria-hidden="true">/</kbd>
                </div>
                <button class="go" type="submit">查詢</button>
            </form>
            <div id="search-suggest" class="suggest-box" role="listbox" aria-label="快速跳轉建議" hidden></div>
        </div>
    </div>
</header>

<div id="app-update" class="warn" role="alert" hidden><span>網站已更新。</span>
    <button type="button" id="app-reload">重新載入</button></div>
<div id="update-bar" class="warn" role="alert" hidden><span></span>
    <button type="button" id="update-yes">下載</button> <button type="button" id="update-no">稍後</button></div>
<main id="result" aria-live="polite"><p class="empty" id="loading-status">資料載入中…</p></main>

<footer>
    <p><span id="data-info"></span> <span id="offline-info"></span></p>
    <p>條文來自法務部全國法規資料庫與行政院主計總處主管法規共用系統；引用關係由程式自動解析，正式用途請以原文為準。
       · <a href="graph.html">關聯圖</a> · <a href="https://github.com/cormort/LawsGraphify">原始碼</a></p>
</footer>
<button id="to-top" type="button" aria-label="回到頂端">↑</button>
<button id="back" type="button" hidden></button>
<div id="scrubber" hidden aria-hidden="true"><div class="thumb"></div><div class="bubble"></div></div>

<div id="speech-bar" role="region" aria-label="語音朗讀控制" hidden>
    <div class="speech-info">
        <div id="speech-title">朗讀中</div>
        <div id="speech-progress"></div>
    </div>
    <div class="speech-actions">
        <button class="tool" type="button" id="speech-prev" aria-label="上一條">‹</button>
        <button class="tool" type="button" id="speech-next" aria-label="下一條">›</button>
        <button class="tool" type="button" id="speech-rate-pill" aria-label="朗讀速度">1×</button>
        <button class="tool" type="button" id="speech-stop">停止</button>
    </div>
</div>

<div id="drawer-backdrop" hidden></div>
<aside id="saved-drawer" aria-label="收藏與最近查看" hidden>
    <div class="drawer-head">
        <h2>我的法典</h2>
        <button class="tool" type="button" id="drawer-close" aria-label="關閉">×</button>
    </div>
    <div class="seg-group drawer-tabs" role="tablist" aria-label="書籤分頁">
        <button class="seg-btn" type="button" role="tab" data-drawer-tab="fav" aria-selected="true" aria-pressed="true">★ 收藏</button>
        <button class="seg-btn" type="button" role="tab" data-drawer-tab="recent" aria-selected="false" aria-pressed="false">🕘 最近查看</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-actions" id="drawer-footer"></div>
</aside>

<dialog id="fav-modal" aria-labelledby="fav-modal-title">
    <h2 id="fav-modal-title">匯入收藏備份</h2>
    <p id="fav-modal-desc" class="muted"></p>
    <textarea id="fav-import-text" spellcheck="false" placeholder="貼上先前匯出的收藏代碼，例如：BUDGET BUDGET-0062"></textarea>
    <p id="fav-import-preview" class="muted"></p>
    <div class="modal-foot">
        <button class="tool" type="button" id="fav-modal-cancel">關閉</button>
        <button class="go" type="button" id="fav-import-confirm">確認匯入</button>
    </div>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="codex.js"></script>
</body>
</html>
