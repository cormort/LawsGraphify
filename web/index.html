<script>
    // Apply saved theme / font size before first paint
    try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme) document.documentElement.dataset.theme = theme;
        const fs = JSON.parse(localStorage.getItem("fontSize"));
        if (fs) document.documentElement.style.setProperty("--fs", fs + "px");
    } catch (e) {}
</script>
<style>
:root {
    --fs: 17px;
    --bg: #f7f7f5; --surface: #ffffff; --border: #e3e2de;
    --text: #1f2328; --muted: #6a6f76; --accent: #3b5bdb; --accent-soft: #edf2ff;
    --warn: #b35c00; --warn-soft: #fff4e5; --mark: #fff3bf;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #111317; --surface: #1a1d23; --border: #2c3038;
        --text: #e6e8eb; --muted: #9aa1ab; --accent: #8ea8ff; --accent-soft: #1f2740;
        --warn: #ffb057; --warn-soft: #33260f; --mark: #4a3f10;
    }
}
:root[data-theme="dark"] {
    --bg: #111317; --surface: #1a1d23; --border: #2c3038;
    --text: #e6e8eb; --muted: #9aa1ab; --accent: #8ea8ff; --accent-soft: #1f2740;
    --warn: #ffb057; --warn-soft: #33260f; --mark: #4a3f10;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font: var(--fs)/1.75 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }

/* Sticky top bar: brand, tools, search */
.topbar {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: max(8px, env(safe-area-inset-top)) 16px 10px;
}
.topbar-inner, main, footer { max-width: 860px; margin: 0 auto; }
.brand-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brand { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
.tools { display: flex; gap: 6px; }
.tool {
    min-width: 40px; min-height: 36px; padding: 0 10px; font-size: 14px; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
}
form { display: flex; gap: 8px; margin-top: 8px; }
input[type=search] {
    flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px;  /* 16px stops iOS zoom-on-focus */
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
}
input[type=search]:focus, .jump input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.go { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); font-size: 16px; }

main { padding: 16px 16px 96px; }
.muted { color: var(--muted); font-size: 0.85em; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
h2 { font-size: 1.15em; margin: 0 0 4px; line-height: 1.5; }
h3 { font-size: 0.9em; margin: 24px 0 8px; color: var(--muted); font-weight: 600; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 0.9em; }
.empty { color: var(--muted); }
.text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; text-align: justify; }
/* Article layout: an item hangs from its marker (凸排); sub-items nest in the item above */
.text .para, .text .item { margin-top: 0.3em; }
.text > :first-child { margin-top: 0; }
.text .item { display: flex; }
.text .mk { flex: none; font-variant-numeric: tabular-nums; }  /* 1. and 2. same width, so siblings align */
.text .body { flex: 1; min-width: 0; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }

.star { flex: none; border: 0; background: none; font-size: 1.4em; line-height: 1; padding: 4px; color: var(--muted); }
.star[aria-pressed="true"] { color: #f2b705; }
.hit-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hit-head > a:first-child { font-weight: 600; text-decoration: none; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#update-bar, #app-update { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 16px 0; }
#update-bar[hidden], #app-update[hidden] { display: none; }
#update-bar span, #app-update span { flex: 1 1 12em; }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-decoration: none; }
.badge.review { background: var(--warn-soft); color: var(--warn); }
.badge.amended { background: var(--mark); color: var(--text); }

a.cite { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
a.cite.focus { background: var(--mark); border-radius: 3px; text-decoration: none; }
.cite-unresolved { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }

/* Lists: laws, favourites, recents, cited articles */
.list a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--text); }
.list > :first-child { border-top: 0; padding-top: 0; }
.list .count { color: var(--muted); font-size: 0.85em; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.chips a { display: inline-flex; align-items: center; text-decoration: none; }
.fav-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 24px 0 8px; }
.fav-head h3 { margin: 0; }
.fav-head .tools .tool { min-height: 30px; font-size: 13px; }
.fav-group { padding: 10px 0; border-top: 1px solid var(--border); }
.fav-group:first-child { border-top: 0; padding-top: 0; }
.fav-group > a { font-weight: 600; text-decoration: none; }
.fav-group .badges { margin-top: 6px; }
.fav-group .badge { font-size: 0.85em; padding: 4px 10px; }
details > summary { cursor: pointer; list-style: none; font-weight: 600; padding: 4px 0; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; color: var(--muted); }
details[open] > summary::before { content: "▾ "; }
details.card[open] > summary { margin-bottom: 8px; }

.article-nav { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; font-size: 0.9em; }
.article-nav a { text-decoration: none; padding: 6px 0; }
.law-article { padding: 14px 0; border-top: 1px solid var(--border); scroll-margin-top: 140px; }
.law-article:first-child { border-top: 0; padding-top: 0; }
.chapter { margin: 18px 0 4px; font-weight: 700; color: var(--accent); scroll-margin-top: 140px; }
.chapter:first-child { margin-top: 0; }
#full-text.only-cited .law-article:not(.is-cited), #full-text.only-cited .chapter { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; font-size: 0.9em; }
.jump { display: flex; align-items: center; gap: 6px; margin: 0; }
.jump input { width: 4.5em; font-size: 16px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
.toc { margin-top: 10px; }
.toc button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--border); padding: 10px 0; color: var(--accent); font-size: 0.9em; }

#to-top {
    position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 18px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
    display: none;
}
/* Full text: scrubber on the right edge; --f is the position, 0 (first article) to 1 (last) */
#scrubber { position: fixed; right: 0; top: 150px; bottom: 76px; width: 32px; z-index: 6; touch-action: none; --f: 0; }
#scrubber::before { content: ""; position: absolute; right: 8px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--border); }
#scrubber .thumb, #scrubber .bubble { position: absolute; top: calc(20px + (100% - 40px) * var(--f)); transform: translateY(-50%); }
#scrubber .thumb { right: 5px; width: 9px; height: 40px; border-radius: 5px; background: var(--accent); opacity: 0.55; }
#scrubber .bubble {
    right: 34px; padding: 4px 12px; border-radius: 8px; white-space: nowrap;
    background: var(--accent); color: var(--surface); font-size: 15px; font-weight: 600;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.2); opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
#scrubber .bubble small { display: block; font-size: 12px; font-weight: 400; opacity: 0.85; }
#scrubber.show .bubble, #scrubber.drag .bubble { opacity: 1; transition: none; }
#scrubber.drag .thumb { opacity: 1; }
#back {
    position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
    max-width: calc(100vw - 96px); min-height: 44px; padding: 0 16px; border-radius: 22px;
    border: 1px solid var(--border); background: var(--surface); color: var(--accent); font-size: 15px;
    box-shadow: 0 2px 8px rgb(0 0 0 / 0.15); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
footer { padding: 0 16px max(24px, env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); }
footer a { color: var(--muted); }
.offline-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
</style>

<body>
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand-row">
            <a class="brand" href="#">📖 隨身法典</a>
            <div class="tools">
                <button class="tool" type="button" data-font="-1" aria-label="縮小字體">A−</button>
                <button class="tool" type="button" data-font="1" aria-label="放大字體">A＋</button>
                <button class="tool" type="button" id="theme-btn" aria-label="切換深淺色">◐</button>
                <button class="tool" type="button" id="install-btn" hidden>安裝</button>
            </div>
        </div>
        <form id="query-form" role="search">
            <input id="q" type="search" list="law-names" autocomplete="off" enterkeyhint="search"
                   placeholder="法規名稱、條號或關鍵字" aria-label="法規名稱、條號或關鍵字">
            <datalist id="law-names"></datalist>
            <button class="go" type="submit">查詢</button>
        </form>
    </div>
</header>

<div id="app-update" class="warn" role="alert" hidden><span>網站已更新。</span>
    <button type="button" id="app-reload">重新載入</button></div>
<div id="update-bar" class="warn" role="alert" hidden><span></span>
    <button type="button" id="update-yes">下載</button> <button type="button" id="update-no">稍後</button></div>
<main id="result" aria-live="polite"><p class="empty">資料載入中…</p></main>

<footer>
    <p><span id="data-info"></span> <span id="offline-info"></span></p>
    <p>條文來自法務部全國法規資料庫與行政院主計總處主管法規共用系統；引用關係由程式自動解析，正式用途請以原文為準。
       · <a href="graph.html">關聯圖</a> · <a href="https://github.com/cormort/LawsGraphify">原始碼</a></p>
</footer>
<button id="to-top" type="button" aria-label="回到頂端">↑</button>
<button id="back" type="button" hidden></button>
<div id="scrubber" hidden aria-hidden="true"><div class="thumb"></div><div class="bubble"></div></div>

<script>
let nodes = new Map();      // id -> node
let incoming = new Map();   // target id -> [edge]
let outgoing = new Map();   // source id -> [edge]
let lawOrder = new Map();   // code -> [article ids in order]
let laws = [];              // [{code, name, kind, count}]
let links = new Map();      // code -> {name, url}: no article text, linked to the original
let lawUrl = new Map();     // code -> DGBAS page, where an article's attachments are
let nameToCode = {};        // normalized name -> code
let codeToName = {};        // code -> display name
let sortedNames = [];       // names, longest first
// hash -> scrollY, restored on back; kept for the tab's session so a reload keeps it
let savedPositions = [];
try { savedPositions = JSON.parse(sessionStorage.getItem("scroll")) || []; } catch (e) {}
const scrollPositions = new Map(savedPositions);

const MAX_RESULTS = 200;

// localStorage can throw (private mode) or be empty; the app works without it
const store = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} },
};

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
}

// "六十二" / "一百十" / "62" -> number (same rules as citation_resolver.chinese_to_arabic)
function toNumber(s) {
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    const digits = { 零: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
    const units = { 十: 10, 百: 100, 千: 1000 };
    let total = 0, digit = 0;
    for (const ch of s) {
        if (ch in digits) digit = digits[ch];
        else if (ch in units) { total += (digit || 1) * units[ch]; digit = 0; }
    }
    return total + digit;
}

function nodeId(code, main, sub) {
    return `${code}-${String(main).padStart(4, "0")}` + (sub ? `-${String(sub).padStart(3, "0")}` : "");
}

function articleLabel(id) {
    const node = nodes.get(id);
    if (node) return node.article_zh;
    const [, main, sub] = id.match(/-(\d{4})(?:-(\d{3}))?$/) || [];
    return main ? `第 ${+main}${sub ? "-" + +sub : ""} 條` : id;
}

function lawName(code) { return codeToName[code] || code; }
function codeOf(id) { return id.replace(/-\d{4}(-\d{3})?$/, ""); }
// 行政規則 number by 點, laws by 條
function unit(code) { return nodes.get(lawOrder.get(code)?.[0])?.article_zh.includes("點") ? "點" : "條"; }
function citerCount(id) { return new Set((incoming.get(id) || []).map(e => e.source)).size; }
function label(id) { return /-\d{4}/.test(id) ? `${lawName(codeOf(id))} ${articleLabel(id)}` : lawName(id); }
function link(id, text) { return `<a href="#${encodeURIComponent(id)}">${escapeHtml(text ?? label(id))}</a>`; }

const NUM = "[0-9零一二三四五六七八九十百千兩]+";
const ARTICLE_PAT = new RegExp(`^第?(${NUM})[條點]?(?:[之\\-](${NUM}))?[條點]?$`);

// Free text -> {type: "article"|"law"|"search", ...}
// 台 is read as 臺, the form the law texts use (same length, so offsets hold)
function parseQuery(raw) {
    const text = raw.normalize("NFKC").replace(/台/g, "臺").trim();
    if (!text) return null;
    const compact = text.replace(/\s+/g, "");
    const sec = text.match(/^(基金|廢止專區)(?:專區)?(?:\s+(.*))?$/);
    if (sec) return sec[2] ? { type: "search", code: null, section: sec[1], ...terms(sec[2]) } : { type: "section", section: sec[1] };
    const direct = compact.toUpperCase().match(/^([A-Z0-9]+)-(\d{1,4})(?:-(\d{1,3}))?$/);
    if (direct && codeToName[direct[1]]) {
        return { type: "article", code: direct[1], main: +direct[2], sub: direct[3] ? +direct[3] : null };
    }
    const name = sortedNames.find(n => compact.includes(n));
    if (!name) return { type: "search", code: null, ...terms(text) };

    const code = nameToCode[name];
    const rest = (text.includes(name) ? text.replace(name, " ") : compact.replace(name, " ")).trim();
    if (!rest) return { type: "law", code };
    const m = rest.replace(/\s+/g, "").match(ARTICLE_PAT);
    if (m) return { type: "article", code, main: toNumber(m[1]), sub: m[2] ? toNumber(m[2]) : null };
    return { type: "search", code, ...terms(rest) };
}

// Sections: "基金" opens one, "基金 用途" searches only its laws
const SECTIONS = {
    "基金": {
        kind: "特種基金", title: "基金收支保管規定專區", where: "基金規定",
        note: n => `${n} 部：各特種基金的收支保管及運用辦法，以及由法律直接規範的基金之法律與管理辦法。`,
        topics: ["來源", "用途", "管理會", "預算", "會計", "決算", "賸餘", "結束"],
        short: l => l.name.replace(/收支保管及運用辦法$/, ""),
    },
    "廢止專區": {
        kind: "廢止", title: "廢止法規專區", where: "已廢止的規定",
        note: n => `${n} 部已廢止的規定，依廢止日期由新到舊排列，僅供查考；一般搜尋與「被引用」不含這些。`,
        topics: [],
        short: l => `${l.name}（${l.abolished} 廢止）`,
        sort: (a, b) => b.abolished.localeCompare(a.abolished),
    },
};
const FUND_KIND = SECTIONS["基金"].kind, ABOLISHED_KIND = SECTIONS["廢止專區"].kind;

function renderSection(key) {
    const sec = SECTIONS[key], list = laws.filter(l => l.kind === sec.kind);
    if (sec.sort) list.sort(sec.sort);
    return `<h2>${sec.title}</h2><p class="muted">${sec.note(list.length)}</p>
        <form class="section-search" data-section="${key}"><input name="n" type="search" enterkeyhint="search" placeholder="在${sec.where}中搜尋" aria-label="在${sec.where}中搜尋"><button class="tool" type="submit">搜尋</button></form>
        ${sec.topics.length ? `<div class="chips">${sec.topics.map(t => `<a class="tool" href="#${encodeURIComponent(key + " " + t)}">${t}</a>`).join("")}</div>` : ""}
        <h3>${sec.where}（${list.length}）</h3>
        <div class="card list">${list.map(l => `<a href="#${encodeURIComponent(l.code)}">
            <span>${escapeHtml(sec.short(l))}</span><span class="count">${l.count} ${unit(l.code)}</span></a>`).join("")}</div>`;
}

function abolishedNote(code) {
    const date = laws.find(l => l.code === code)?.abolished;
    return date ? `<p class="warn">本規定已於 ${date} 廢止，僅供查考。</p>` : "";
}

// "流用 預備金 -特別" -> include all of [流用, 預備金], exclude [特別]
function terms(text) {
    const words = text.split(/\s+/).filter(Boolean);
    return {
        include: words.filter(w => !w.startsWith("-")),
        exclude: words.filter(w => w.startsWith("-") && w.length > 1).map(w => w.slice(1)),
    };
}

// [start, end) of every occurrence of words in node.norm (same offsets as node.text), in order
function hitRanges(node, words) {
    const ranges = [];
    for (const w of words.filter(Boolean)) {
        for (let i = node.norm.indexOf(w); i >= 0; i = node.norm.indexOf(w, i + w.length)) ranges.push([i, i + w.length]);
    }
    return ranges.sort((x, y) => x[0] - y[0]);
}

// Escaped text[a, b) with the parts inside ranges wrapped in <mark>
function marked(text, a, b, ranges) {
    let html = "", pos = a;
    for (const [s, e] of ranges) {
        const from = Math.max(s, pos), to = Math.min(e, b);
        if (from >= to) continue;
        html += escapeHtml(text.slice(pos, from)) + `<mark>${escapeHtml(text.slice(from, to))}</mark>`;
        pos = to;
    }
    return html + escapeHtml(text.slice(pos, b));
}

// Article text[from, to) with each citation as a link; citations of focusId are
// linked with a highlight, and the given ranges (search terms) are marked
function linkify(node, focusId, ranges = [], from = 0, to = (node.text || "").length) {
    const text = node.text || "";
    const bySpan = new Map();  // "a,b" -> targets (a range has several)
    for (const e of outgoing.get(node.id) || []) {
        for (const [a, b] of e.spans || []) {
            const key = `${a},${b}`;
            if (!bySpan.has(key)) bySpan.set(key, { a, b, targets: [] });
            bySpan.get(key).targets.push(e.target);
        }
    }
    // Attachment file names ("附表一.pdf"): the files are on the law's original page
    const url = lawUrl.get(node.law_code);
    if (url) {
        for (const m of text.matchAll(/[^\s，。；：、]+?\.(?:pdf|odt|ods|docx?|xlsx?)/gi)) {
            bySpan.set(`${m.index},file`, { a: m.index, b: m.index + m[0].length, targets: [], url });
        }
    }
    let html = "", pos = from;
    for (let { a, b, targets, url } of [...bySpan.values()].sort((x, y) => x.a - y.a)) {
        a = Math.max(a, from);  // a citation across a line break is cut in two
        b = Math.min(b, to);
        if (a < pos || a >= b) continue;  // outside, or overlapping span: keep the first
        html += marked(text, pos, a, ranges);
        const words = marked(text, a, b, ranges);
        const known = targets.filter(Boolean);
        if (url) {
            html += `<a class="cite" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="附件請到主計總處原文頁下載">${words}</a>`;
        } else if (!known.length) {
            html += `<span class="cite-unresolved" title="引用的法規未收錄">${words}</span>`;
        } else {
            const title = known.map(label).join("、");
            const focus = focusId && known.includes(focusId) ? " focus" : "";
            html += `<a class="cite${focus}" href="#${encodeURIComponent(known[0])}" title="${escapeHtml(title)}">${words}</a>`;
        }
        pos = b;
    }
    return html + marked(text, pos, to, ranges);
}

// Item markers: 一、 (一) 1. 1、 (1) 甲、, matched on node.norm (half-width)
const MARKERS = [
    ["cn", /^[一二三四五六七八九十百]+、/],
    ["cnp", /^\([一二三四五六七八九十百]+\)/],
    ["num", /^\d+ ?[、.](?!\d)/],
    ["nump", /^\(\d+\)/],
    ["gan", /^[甲乙丙丁戊己庚辛壬癸][、.]/],
];

function marker(s) {
    for (const [type, re] of MARKERS) {
        const m = s.match(re);
        if (m) return { type, length: m[0].length };
    }
    return null;
}

// Line breaks were flattened to spaces when the laws were fetched. A space is a
// break unless it touches Latin text ("PDF 檔", "1 、"); one before a marker or after an
// attachment's file name ("附表一.pdf 附表一.odt") always is.
// Some 行政規則 lost even the space: a marker right after 。：；starts a line too.
function lines(norm) {
    const latin = c => /[A-Za-z0-9]/.test(c || "");
    const out = [];
    let start = 0;
    for (let i = 1; i < norm.length; i++) {
        if (norm[i] === " " && (marker(norm.slice(i + 1)) || /\.(?:pdf|odt|ods|docx?|xlsx?)$/i.test(norm.slice(start, i))
                || !(latin(norm[i - 1]) || latin(norm[i + 1])))) {
            out.push([start, i]);
            start = i + 1;
        } else if (/[。:;︰]/.test(norm[i - 1]) && marker(norm.slice(i))) {
            out.push([start, i]);
            start = i;
        }
    }
    out.push([start, norm.length]);
    return out.filter(([a, b]) => a < b);
}

// Article text laid out by line: a line without a marker is a paragraph (項);
// an item hangs from its marker, and an item of a new kind nests in the one above
function formatText(node, focusId, ranges = []) {
    let html = "";
    const open = [];  // marker types of the open items, outermost first
    const close = depth => { while (open.length > depth) { open.pop(); html += "</div></div>"; } };
    for (const [a, b] of lines(node.norm)) {
        const m = marker(node.norm.slice(a, b));
        if (!m) {
            // A line that is only an attachment's file name stays in the item above
            if (!/^\S+\.(?:pdf|odt|ods|docx?|xlsx?)$/i.test(node.norm.slice(a, b))) close(0);
            html += `<div class="para">${linkify(node, focusId, ranges, a, b)}</div>`;
            continue;
        }
        const level = open.indexOf(m.type);
        close(level >= 0 ? level : open.length);
        open.push(m.type);
        html += `<div class="item"><span class="mk">${linkify(node, focusId, ranges, a, a + m.length)}</span>`
            + `<div class="body">${linkify(node, focusId, ranges, a + m.length, b)}`;
    }
    close(0);
    return html;
}

// List views pass favs in, so a long law reads storage once
function starButton(id, favs = store.get("favs", [])) {
    const on = favs.includes(id);
    return `<button class="star" type="button" data-fav="${escapeHtml(id)}" aria-pressed="${on}"
        aria-label="${on ? "取消收藏" : "加入收藏"}">${on ? "★" : "☆"}</button>`;
}

function edgeBadges(edges) {
    const subRefs = [...new Set(edges.map(e => e.sub_ref).filter(Boolean))];
    const badges = subRefs.map(s => `<span class="badge">${escapeHtml(s)}</span>`);
    if (edges.some(e => e.kind === "relative")) badges.push(`<span class="badge">相對引用</span>`);
    const review = edges.filter(e => e.needs_review);
    if (review.length) {
        const pct = Math.round(Math.min(...review.map(e => e.confidence)) * 100);
        badges.push(`<span class="badge review">需複核 ${pct}%</span>`);
    }
    return badges.join("");
}

function groupBySource(edges) {
    const groups = new Map();
    edges.forEach(e => groups.set(e.source, [...(groups.get(e.source) || []), e]));
    return [...groups.values()];
}

// Articles changed by the last law updates the user downloaded, newest first
const AMENDED_DAYS = 60;
function amended() {
    const since = new Date(Date.now() - AMENDED_DAYS * 864e5).toLocaleDateString("sv");
    return store.get("amended", []).filter(a => a.date >= since && known(a.id));
}

function amendedBadge(id, list) {
    const a = list.find(x => x.id === id);
    return a ? `<span class="badge amended" title="${escapeHtml(a.date)} 下載更新時有修正">新修正 ${escapeHtml(a.date.slice(5).replace("-", "/"))}</span>` : "";
}

function rememberRecent(id) {
    const recents = store.get("recents", []).filter(x => x !== id);
    store.set("recents", [id, ...recents].slice(0, 10));
}

// --- Views ---

function known(id) { return nodes.has(id) || lawOrder.has(id); }

// Favourites grouped by law: laws in the order first starred, articles in article order
function renderFavs(favs) {
    const groups = new Map();
    for (const id of favs) {
        const code = /-\d{4}/.test(id) ? codeOf(id) : id;
        if (!groups.has(code)) groups.set(code, []);
        if (id !== code) groups.get(code).push(id);
    }
    return `<div class="card">${[...groups].map(([code, ids]) => `<div class="fav-group">${link(code, lawName(code))}
        ${ids.length ? `<div class="badges">${ids.sort().map(id =>
            `<a class="badge" href="#${encodeURIComponent(id)}">${escapeHtml(articleLabel(id))}</a>`).join("")}</div>` : ""}</div>`).join("")}</div>`;
}

// Favourites live only in this browser (Safari may clear them), so they can be copied out and pasted back
// "預算法第 62 條：…" for pasting into a document
async function copyArticle(button) {
    const node = nodes.get(button.dataset.copy);
    const text = `${node.law_name}${node.article_zh}：${node.text}`;
    try {
        await navigator.clipboard.writeText(text);
        button.textContent = "已複製";
        setTimeout(() => { button.textContent = "複製"; }, 1500);
    } catch {
        prompt("複製下面這段文字：", text);
    }
}

async function exportFavs() {
    const text = store.get("favs", []).join(" ");
    try {
        await navigator.clipboard.writeText(text);
        alert("已複製收藏，可貼到備忘錄保存；換手機或資料被清除時，用「匯入」貼回來。");
    } catch {
        prompt("複製下面這段文字保存，換手機或資料被清除時，用「匯入」貼回來：", text);
    }
}

function importFavs() {
    const text = prompt("貼上之前匯出的收藏：");
    if (!text) return;
    const favs = store.get("favs", []);
    const added = [...new Set(text.normalize("NFKC").trim().split(/[\s,]+/))].filter(id => known(id) && !favs.includes(id));
    store.set("favs", [...favs, ...added]);
    alert(`匯入 ${added.length} 筆收藏。`);
    runFromHash();
}

function originalLink(link) {
    return `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener"><span>${escapeHtml(link.name)}</span><span class="count">原文 ↗</span></a>`;
}

function renderHome() {
    const favs = store.get("favs", []).filter(known);
    const recents = store.get("recents", []).filter(known);
    let html = `<p class="muted">點法規看全文，條文中的引用可以點擊跳轉。也可以輸入條號（預算法第62條）或關鍵字（預算法 流用）。</p>`;
    html += `<div class="fav-head"><h3>★ 收藏</h3><div class="tools">
        ${favs.length ? `<button class="tool" type="button" data-fav-io="export">匯出</button>` : ""}
        <button class="tool" type="button" data-fav-io="import">匯入</button></div></div>`;
    html += favs.length ? renderFavs(favs) : `<p class="empty">點法規或條文旁的 ☆ 加入收藏。</p>`;
    const changes = amended();
    if (changes.length) {
        html += `<h3>最近修正（下載更新時比對）</h3><div class="card list">${changes.map(a =>
            `<a href="#${encodeURIComponent(a.id)}"><span>${escapeHtml(label(a.id))}</span><span class="count">${escapeHtml(a.date)}</span></a>`).join("")}</div>`;
    }
    if (recents.length) html += `<h3>最近查看</h3><div class="card list">${recents.map(id => link(id)).join("")}</div>`;
    const kinds = [...new Set(laws.map(l => l.kind))];
    html += `<h3>法規（${laws.length} 部）</h3>`;
    html += kinds.map(kind => {
        const group = laws.filter(l => l.kind === kind);
        const key = Object.keys(SECTIONS).find(k => SECTIONS[k].kind === kind);
        if (key) return `<div class="card list"><a href="#${encodeURIComponent(key)}"><span>${SECTIONS[key].title} →</span><span class="count">${group.length} 部</span></a></div>`;
        return `<details class="card"${group.length > 50 ? "" : " open"}><summary>${escapeHtml(kind)}（${group.length}）</summary>
            <div class="list">${group.map(l => `<a href="#${encodeURIComponent(l.code)}">
                <span>${escapeHtml(l.name)}</span><span class="count">${l.count} ${unit(l.code)}</span></a>`).join("")}</div></details>`;
    }).join("");
    if (links.size) {
        html += `<details class="card"><summary>沒有收錄條文，連到原文（${links.size}）</summary>
            <div class="list">${[...links.values()].map(originalLink).join("")}</div></details>`;
    }
    return html;
}

function renderArticle(q, marks) {
    const id = nodeId(q.code, q.main, q.sub);
    const target = nodes.get(id);
    const lawHasText = lawOrder.has(q.code);
    let html = "";

    if (lawHasText) {
        const order = lawOrder.get(q.code), i = order.indexOf(id);
        const step = (t, txt) => t ? link(t, txt) : `<span class="muted">${txt}</span>`;
        html += `<nav class="article-nav">${link(q.code, `← 《${lawName(q.code)}》全文`)}
            <span>${step(order[i - 1], "‹ 上一條")}　${step(order[i + 1], "下一條 ›")}</span></nav>`;
    }
    html += `<div class="card"><div class="title-row"><h2>${escapeHtml(label(id))}</h2>${target ? `<div class="tools">
        <button class="tool" type="button" data-copy="${escapeHtml(id)}">複製</button>${starButton(id)}</div>` : ""}</div>`;
    html += abolishedNote(q.code);
    if (target) {
        const badge = amendedBadge(id, amended());
        if (badge) html += `<div class="badges">${badge}</div>`;
        if (target.chapter) html += `<p class="muted">${escapeHtml(target.chapter)}</p>`;
        html += `<div class="text">${formatText(target, null, hitRanges(target, marks))}</div>`;
        rememberRecent(id);
    } else if (lawHasText) {
        html += `<div class="warn">資料中沒有這一條（可能已刪除、改條號，或條號輸入錯誤）。${incoming.has(id) ? "下面的引用可能已經失效。" : ""}</div>`;
    } else {
        html += `<p class="muted">這部法規沒有收錄全文，只列出引用它的條文。</p>`;
    }

    const bySource = groupBySource(incoming.get(id) || []), favs = store.get("favs", []);
    html += `</div>${target && fundCodes().has(q.code) ? renderSimilar(target, favs) : ""}<h3>被 ${bySource.length} 條條文引用</h3>`;
    if (!bySource.length) return html + `<p class="empty">沒有其他條文引用這一條。</p>`;
    // Other laws first, then the same law; each in article order
    const own = sid => sid.startsWith(q.code + "-");
    bySource.sort((a, b) => (own(a[0].source) - own(b[0].source)) || a[0].source.localeCompare(b[0].source));
    return html + bySource.map(group => {
        const src = nodes.get(group[0].source);
        return `<div class="card"><div class="hit-head">${link(src.id)}<div class="badges">${edgeBadges(group)}${starButton(src.id, favs)}</div></div>
            <div class="text">${formatText(src, id)}</div></div>`;
    }).join("");
}

// Fund regulations are mostly written from one template. For a fund article, say
// whether it is the common wording or the fund's own, and show the closest
// article of each other fund. Similarity: shared character pairs (Jaccard).
const SAME = 0.9, OWN = 0.5, SIMILAR_SHOWN = 5;
const pairCache = new Map();
function fundCodes() { return new Set(laws.filter(l => l.kind === FUND_KIND).map(l => l.code)); }
function pairs(node) {
    if (!pairCache.has(node.id)) {
        const t = node.norm.replace(/本基金|本辦法|\s/g, "");
        pairCache.set(node.id, new Set(Array.from({ length: t.length - 1 }, (_, i) => t.slice(i, i + 2))));
    }
    return pairCache.get(node.id);
}
function similarity(a, b) {
    let shared = 0;
    for (const p of a) if (b.has(p)) shared++;
    return shared / (a.size + b.size - shared || 1);
}
function renderSimilar(node, favs) {
    const mine = pairs(node);
    const best = [...fundCodes()].filter(code => code !== node.law_code).map(code => {
        let top = { score: 0 };
        for (const id of lawOrder.get(code) || []) {
            const score = similarity(mine, pairs(nodes.get(id)));
            if (score > top.score) top = { id, score };
        }
        return top;
    }).filter(t => t.id).sort((a, b) => b.score - a.score);
    const same = best.filter(t => t.score >= SAME).length;
    const summary = same ? `另有 ${same} 個基金有相同規定（相似度 90% 以上）`
        : best[0]?.score >= OWN ? "其他基金有類似但不相同的規定" : "本基金特有：其他基金沒有相似度 50% 以上的規定";
    return `<h3>其他基金的類似規定</h3><p class="muted">${summary}</p>` + best.slice(0, SIMILAR_SHOWN).filter(t => t.score >= 0.3).map(t =>
        `<div class="card"><div class="hit-head">${link(t.id)}<div class="badges"><span class="badge">相似 ${Math.round(t.score * 100)}%</span>${starButton(t.id, favs)}</div></div>
            <div class="text">${formatText(nodes.get(t.id))}</div></div>`).join("");
}

// Whole law: table of contents, jump box, full text with live citations
function renderFullText(code) {
    const ids = lawOrder.get(code);
    const cited = ids.filter(id => citerCount(id)).length;
    const chapters = ids.filter(id => nodes.get(id).chapter);
    const favs = store.get("favs", []);
    rememberRecent(code);

    let html = `<div class="card"><div class="title-row"><h2>${escapeHtml(lawName(code))}</h2>${starButton(code)}</div>${abolishedNote(code)}
        <p class="muted">共 ${ids.length} ${unit(code)}，${cited} ${unit(code)}被其他條文引用</p>
        <div class="controls">
            <form class="jump" data-law="${escapeHtml(code)}">跳至 <input name="n" inputmode="numeric" enterkeyhint="go" aria-label="條號"> ${unit(code)}</form>
            <label><input type="checkbox" id="only-cited"> 只看被引用的</label>
        </div>`;
    if (chapters.length) {
        html += `<details class="toc"><summary>目錄（${chapters.length} 章）</summary>
            ${chapters.map(id => `<button type="button" data-scroll="ch-${escapeHtml(id)}">${escapeHtml(nodes.get(id).chapter)}</button>`).join("")}</details>`;
    }
    html += `</div><div class="card" id="full-text">`;
    const changes = amended();
    let current = "";  // the chapter an article is in, for the scrubber
    html += ids.map(id => {
        const node = nodes.get(id), n = citerCount(id);
        const chapter = node.chapter ? `<div class="chapter" id="ch-${escapeHtml(id)}">${escapeHtml(node.chapter)}</div>` : "";
        current = node.chapter || current;
        return `${chapter}<article class="law-article${n ? " is-cited" : ""}" id="a-${escapeHtml(id)}" data-chapter="${escapeHtml(current)}">
            <div class="hit-head">${link(id, node.article_zh)}<div class="badges">${amendedBadge(id, changes)}
                ${n ? `<a class="badge" href="#${encodeURIComponent(id)}">被 ${n} 條引用</a>` : ""}${starButton(id, favs)}</div></div>
            <div class="text">${formatText(node)}</div></article>`;
    }).join("");
    return html + `</div>`;
}

// Law without full text (external): which of its articles are cited
function renderCitedList(code) {
    const cited = [...incoming.keys()].filter(id => id.startsWith(code + "-")).sort();
    const link = links.get(code);
    return `<div class="card"><h2>${escapeHtml(lawName(code))}</h2>
        ${link ? `<p class="muted">這部沒有收錄條文（只有附件，或不在法務部、主計總處的系統），請看原文：</p><div class="list">${originalLink(link)}</div>`
               : `<p class="muted">這部法規沒有收錄全文，以下是被引用的條文。</p>`}</div>`
        + (cited.length ? `<div class="card list">${cited.map(id => `<a href="#${encodeURIComponent(id)}">
            <span>${escapeHtml(articleLabel(id))}</span><span class="count">${citerCount(id)} 處</span></a>`).join("")}</div>` : "");
}

// Keyword search (all laws, or one law): every include term, no exclude term
function renderSearch(q) {
    if (!q.include.length) return `<p class="warn">請輸入要搜尋的關鍵字。</p>`;
    const scope = q.code ? lawOrder.get(q.code) || []
        : laws.filter(l => q.section ? l.kind === SECTIONS[q.section].kind : l.kind !== ABOLISHED_KIND)
            .flatMap(l => lawOrder.get(l.code) || []);
    const hits = scope.filter(id => {
        const t = nodes.get(id).norm;
        return q.include.every(w => t.includes(w)) && !q.exclude.some(w => t.includes(w));
    });
    const favs = store.get("favs", []);
    const where = q.code ? `《${lawName(q.code)}》` : q.section ? SECTIONS[q.section].where : "全部法規";
    let html = `<h3>在${escapeHtml(where)}中找到 ${hits.length} 條「${escapeHtml(q.include.join(" "))}」${q.exclude.length ? `（排除 ${escapeHtml(q.exclude.join("、"))}）` : ""}</h3>`;
    if (!hits.length) return html + `<p class="empty">沒有符合的條文。${q.code ? "" : "要查法規請輸入完整名稱，例如「預算法」。"}</p>`;
    // The keywords ride along to the article page, which marks them too
    const mark = "?mark=" + encodeURIComponent(q.include.join(" "));
    html += hits.slice(0, MAX_RESULTS).map(id =>
        `<div class="card"><div class="hit-head"><a href="#${encodeURIComponent(id)}${mark}">${escapeHtml(label(id))}</a>${starButton(id, favs)}</div><p class="text">${snippet(nodes.get(id), q.include)}</p></div>`
    ).join("");
    if (hits.length > MAX_RESULTS) html += `<p class="muted">只顯示前 ${MAX_RESULTS} 條，請加關鍵字縮小範圍。</p>`;
    return html;
}

// ~160 characters around the first hit, every term marked
function snippet(node, words) {
    const text = node.text;  // same length as node.norm
    const first = Math.min(...words.map(w => node.norm.indexOf(w)).filter(i => i >= 0));
    const start = Math.max(0, first - 60), end = Math.min(text.length, first + 100);
    return (start ? "…" : "") + marked(text, start, end, hitRanges(node, words)) + (end < text.length ? "…" : "");
}

function render(raw, marks) {
    const result = document.getElementById("result");
    const q = parseQuery(raw);
    if (!q) result.innerHTML = renderHome();
    else if (q.type === "article") result.innerHTML = renderArticle(q, marks);
    else if (q.type === "section") result.innerHTML = renderSection(q.section);
    else if (q.type === "law") result.innerHTML = lawOrder.has(q.code) ? renderFullText(q.code) : renderCitedList(q.code);
    else result.innerHTML = renderSearch(q);
    return q;
}

// "預算法 第 32 條" rather than the internal id a link carried
function queryLabel(q, raw) {
    return !q ? "" : q.type === "article" ? label(nodeId(q.code, q.main, q.sub)) : q.type === "law" ? lawName(q.code) : raw;
}

function runFromHash() {
    const [path, mark] = location.hash.slice(1).split("?mark=");
    const raw = decodeURIComponent(path);
    const q = render(raw, mark ? decodeURIComponent(mark).split(" ") : []);
    document.getElementById("q").value = queryLabel(q, raw);
    window.scrollTo(0, scrollPositions.get(location.hash) || 0);
    updateScrubber();
    updateBack();
}

// "← 預算法" back to where a link was followed from. Each history entry keeps the
// hash it was reached from, so the button follows the phone's own back and still
// works after a reload; a home-screen app on iPhone has no back button of its own.
const back = document.getElementById("back");
function updateBack() {
    const from = history.state?.from;
    back.hidden = from === undefined;
    if (back.hidden) return;
    const raw = decodeURIComponent(from.slice(1).split("?mark=")[0]);
    back.textContent = "← " + (queryLabel(parseQuery(raw), raw) || "首頁");
}
back.addEventListener("click", () => history.back());

// --- Data & wiring ---

// Law texts live in their own cache, one file per law. The first visit downloads
// them all; later visits compare laws/index.json hashes and ask before
// downloading only the laws that changed.
const DATA = "laws-data";

async function fetchOk(path) {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) throw new Error(`${path} ${response.status}`);
    return response;
}

// Everything is fetched before anything is written, so a dropped connection keeps the old data
async function download(cache, index, codes, removed = []) {
    const files = await Promise.all(codes.map(code => fetchOk(`laws/${code}.json`)));
    const changed = (await Promise.all(files.map((file, i) => changedArticles(cache, codes[i], file)))).flat();
    await Promise.all(files.map((file, i) => cache.put(`laws/${codes[i]}.json`, file)));
    if (changed.length) {
        const date = new Date().toLocaleDateString("sv");
        const older = store.get("amended", []).filter(a => !changed.includes(a.id));
        store.set("amended", [...changed.map(id => ({ id, date })), ...older].slice(0, 100));
    }
    await Promise.all(removed.map(code => cache.delete(`laws/${code}.json`)));
    await cache.put("laws/index.json", new Response(JSON.stringify(index)));
}

// Article ids whose text differs from the copy already on the phone (none on first install)
async function changedArticles(cache, code, file) {
    const old = await cache.match(`laws/${code}.json`);
    if (!old) return [];
    const before = new Map((await old.json()).nodes.map(n => [n.id, n.text]));
    return (await file.clone().json()).nodes.filter(n => before.get(n.id) !== n.text).map(n => n.id);
}

async function checkUpdates(cache, local) {
    const remote = await (await fetchOk("laws/index.json")).json();
    const had = new Map(local.laws.map(l => [l.code, l.hash]));
    const changed = remote.laws.filter(l => had.get(l.code) !== l.hash);
    const removed = local.laws.map(l => l.code).filter(code => !remote.laws.some(l => l.code === code));
    if (!changed.length && !removed.length) {
        if (JSON.stringify({ ...remote, built: 0 }) !== JSON.stringify({ ...local, built: 0 }))
            await download(cache, remote, []);  // aliases or dates only: nothing to ask about
        return;
    }
    const bar = document.getElementById("update-bar"), yes = document.getElementById("update-yes");
    const names = changed.map(l => l.name);
    bar.querySelector("span").textContent = `法規有更新：${names.slice(0, 3).join("、")}${names.length > 3 ? ` 等 ${names.length} 部` : ""}` +
        (removed.length ? `（另移除 ${removed.length} 部）` : "") + "，要下載嗎？";
    bar.hidden = false;
    document.getElementById("update-no").onclick = () => { bar.hidden = true; };
    yes.onclick = async () => {
        yes.disabled = true;
        yes.textContent = "下載中…";
        try {
            await download(cache, remote, changed.map(l => l.code), removed);
            location.reload();
        } catch {
            yes.disabled = false;
            yes.textContent = "重試";
        }
    };
}

async function loadData() {
    const cache = await caches.open(DATA);
    let index = await (await cache.match("laws/index.json"))?.json();
    if (index) {
        checkUpdates(cache, index).catch(() => {});  // offline: keep what we have
    } else {
        index = await (await fetchOk("laws/index.json")).json();
        await download(cache, index, index.laws.map(l => l.code));
    }
    const files = await Promise.all(index.laws.map(async l => (await cache.match(`laws/${l.code}.json`)).json()));
    return { ...index, nodes: files.flatMap(f => f.nodes), edges: files.flatMap(f => f.edges) };
}

async function init() {
    const data = await loadData();
    data.nodes.forEach(n => {
        // Half-width per character, keeping any character that would expand
        // ("︰" -> ".."), so search offsets line up with the original text
        n.norm = [...n.text].map(c => { const h = c.normalize("NFKC"); return h.length === c.length ? h : c; }).join("").replace(/台/g, "臺");
        nodes.set(n.id, n);
        if (!lawOrder.has(n.law_code)) lawOrder.set(n.law_code, []);
        lawOrder.get(n.law_code).push(n.id);
    });
    const abolished = new Set(data.laws.filter(l => l.abolished).map(l => l.code));
    data.edges.forEach(e => {
        if (!outgoing.has(e.source)) outgoing.set(e.source, []);
        outgoing.get(e.source).push(e);
        if (!e.target) return;  // unresolved citations have nowhere to land
        if (abolished.has(nodes.get(e.source)?.law_code)) return;  // nor do abolished laws count as citing it
        if (!incoming.has(e.target)) incoming.set(e.target, []);
        incoming.get(e.target).push(e);
    });
    laws = data.laws || [];
    links = new Map((data.links || []).map(l => [l.code, l]));
    lawUrl = new Map(laws.filter(l => l.url).map(l => [l.code, l.url]));

    nameToCode = data.aliases || {};
    data.nodes.forEach(n => { nameToCode[n.law_name.normalize("NFKC")] = n.law_code; });
    // Display name: the law's own name if we have it, else its longest alias
    for (const [name, code] of Object.entries(nameToCode)) {
        if (name !== code && (!codeToName[code] || name.length > codeToName[code].length)) codeToName[code] = name;
    }
    data.nodes.forEach(n => { codeToName[n.law_code] = n.law_name; });
    sortedNames = Object.keys(nameToCode).sort((a, b) => b.length - a.length);

    document.getElementById("law-names").innerHTML = laws
        .map(l => `<option value="${escapeHtml(l.name)}">`).join("");
    document.getElementById("data-info").textContent =
        `${laws.length} 部法規、${nodes.size} 條條文 · 法務部資料 ${data.moj_updated || "—"} · 建置 ${data.built || ""}`;
    runFromHash();
}

document.getElementById("query-form").addEventListener("submit", e => {

window.addEventListener("hashchange", e => {

// "跳至 N 條" inside a law's full text
document.addEventListener("submit", e => {

// Theme: auto -> light -> dark
const THEMES = [null, "light", "dark"];
document.getElementById("theme-btn").addEventListener("click", () => {

// Full text: the scrubber shows which article is at the top of the screen, and
// dragging it jumps article by article (equal share each, however long)
const scrubber = document.getElementById("scrubber");
const SCRUB_LINE = 141;  // just below .law-article's scroll-margin-top, where a jump lands
let scrubTimer = null;

function scrubList() {
    return [...document.querySelectorAll("#full-text .law-article")].filter(el => el.offsetParent);
}

function showScrub(list, i) {
    scrubber.style.setProperty("--f", list.length > 1 ? i / (list.length - 1) : 0);
    const chapter = list[i].dataset.chapter;
    scrubber.querySelector(".bubble").innerHTML = escapeHtml(list[i].querySelector(".hit-head a").textContent)
        + (chapter ? `<small>${escapeHtml(chapter)}</small>` : "");
}

function updateScrubber() {
    const list = scrubList();
    scrubber.hidden = list.length <= 5;
    if (scrubber.hidden || scrubber.classList.contains("drag")) return;
    scrubber.style.top = document.querySelector(".topbar").offsetHeight + 12 + "px";
    let i = 0;  // last article whose top has passed the line (binary search)
    for (let lo = 0, hi = list.length - 1; lo <= hi;) {
        const mid = (lo + hi) >> 1;
        if (list[mid].getBoundingClientRect().top <= SCRUB_LINE) { i = mid; lo = mid + 1; } else hi = mid - 1;
    }
    // At the very bottom the last articles can't reach the line
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) i = list.length - 1;
    showScrub(list, i);
}

function scrubTo(e) {
    const list = scrubList(), rect = scrubber.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientY - rect.top - 20) / (rect.height - 40)));
    const i = Math.round(f * (list.length - 1));
    list[i].scrollIntoView();
    showScrub(list, i);
}

scrubber.addEventListener("pointerdown", e => {
    e.preventDefault();
    scrubber.setPointerCapture(e.pointerId);
    scrubber.classList.add("drag");
    scrubTo(e);
});
scrubber.addEventListener("pointermove", e => { if (scrubber.classList.contains("drag")) scrubTo(e); });
for (const type of ["pointerup", "pointercancel"]) {
    scrubber.addEventListener(type, () => scrubber.classList.remove("drag"));
}
window.addEventListener("scroll", () => {
    if (scrubber.hidden) return;
    updateScrubber();
    scrubber.classList.add("show");
    clearTimeout(scrubTimer);
    scrubTimer = setTimeout(() => scrubber.classList.remove("show"), 1000);
}, { passive: true });

const toTop = document.getElementById("to-top");
window.addEventListener("scroll", () => { toTop.style.display = window.scrollY > 600 ? "block" : "none"; }, { passive: true });
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

// Install: Chrome / Edge / Android offer a prompt; iPhone Safari has none, so explain the steps
const installBtn = document.getElementById("install-btn");
let installPrompt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
installBtn.hidden = standalone || !iOS;
window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;
    installBtn.hidden = false;
});
window.addEventListener("appinstalled", () => { installBtn.hidden = true; });
installBtn.addEventListener("click", async () => {
    if (!installPrompt) {
        alert("用 Safari 開啟本頁，點下方「分享」→「加入主畫面」，即可像 App 一樣離線使用。");
        return;
    }
    installPrompt.prompt();
    if ((await installPrompt.userChoice).outcome === "accepted") installBtn.hidden = true;
    installPrompt = null;
});

// Offline: cache the app and data on the phone
function showOnline() {
    const info = document.getElementById("offline-info");
    if (!navigator.onLine) info.innerHTML = `<span class="offline-pill">離線中</span>`;
    else if (navigator.serviceWorker?.controller) info.textContent = "· ✓ 已可離線使用";
    else info.textContent = "";
}
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(showOnline).catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", showOnline);
    // sw.js fetched a newer page than the one showing; it is cached, so a reload is instant
    navigator.serviceWorker.addEventListener("message", e => {
        if (e.data === "app-updated") document.getElementById("app-update").hidden = false;
    });
    document.getElementById("app-reload").addEventListener("click", () => location.reload());
}
window.addEventListener("online", showOnline);
window.addEventListener("offline", showOnline);
showOnline();

init().catch(err => {
    document.getElementById("result").innerHTML =
        `<p class="warn">讀不到法規資料（${escapeHtml(err.message)}）。請在專案目錄執行 <code>python3 run_server.py</code> 再開啟。</p>`;
});
