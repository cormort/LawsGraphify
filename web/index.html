<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法規引用查詢</title>
<meta name="description" content="輸入條文，列出所有引用它的法規條文。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%233b5bdb%22/%3E%3Cpath d=%22M9 8h9a5 5 0 0 1 0 10h-4v6H9z%22 fill=%22white%22/%3E%3C/svg%3E">
<style>
:root {
    --bg: #f7f7f5; --surface: #ffffff; --border: #e3e2de;
    --text: #1f2328; --muted: #6a6f76; --accent: #3b5bdb; --accent-soft: #edf2ff;
    --warn: #b35c00; --warn-soft: #fff4e5; --mark: #fff3bf;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #111317; --surface: #1a1d23; --border: #2c3038;
        --text: #e6e8eb; --muted: #9aa1ab; --accent: #8ea8ff; --accent-soft: #1f2740;
        --warn: #ffb057; --warn-soft: #33260f; --mark: #4a3f10;
    }
}
:root[data-theme="dark"] {
    --bg: #111317; --surface: #1a1d23; --border: #2c3038;
    --text: #e6e8eb; --muted: #9aa1ab; --accent: #8ea8ff; --accent-soft: #1f2740;
    --warn: #ffb057; --warn-soft: #33260f; --mark: #4a3f10;
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); font-size: 14px; }
form { display: flex; gap: 8px; margin: 20px 0 8px; }
input[type=search] {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
}
input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button {
    font: inherit; padding: 10px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--surface); cursor: pointer;
}
.examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.examples button {
    padding: 4px 10px; font-size: 14px; background: var(--accent-soft); color: var(--accent);
}
.card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 12px;
}
.target h2 { font-size: 18px; margin: 0 0 6px; }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: 14px; }
h3 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); font-weight: 600; }
.hit-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hit-head a { font-weight: 600; text-decoration: none; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.review { background: var(--warn-soft); color: var(--warn); }
.text { margin: 8px 0 0; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 14px; margin-top: 6px; }
.article-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
.article-row:first-child { border-top: 0; }
.article-row a { text-decoration: none; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<main>
    <header>
        <h1>法規引用查詢</h1>
        <a class="muted" href="graph.html">看關聯圖 →</a>
    </header>
    <p class="muted">輸入法規與條號，列出所有引用它的條文。只輸入法規名稱，會列出這部法規被引用的每一條。</p>

    <form id="query-form" role="search">
        <input id="q" type="search" list="law-names" autocomplete="off"
               placeholder="例：預算法第62條、預算法 62-1、會計法" aria-label="法規與條號">
        <datalist id="law-names"></datalist>
        <button type="submit">查詢</button>
    </form>
    <div class="examples" id="examples"></div>

    <div id="result" aria-live="polite"><p class="empty">資料載入中…</p></div>
</main>

<script>
let nodes = new Map();      // id -> node
let incoming = new Map();   // target id -> [edge]
let lawsInData = new Set(); // codes whose full text we have
let nameToCode = {};        // normalized name -> code
let codeToName = {};        // code -> display name
let sortedNames = [];       // names, longest first

const EXAMPLES = ["預算法第62條", "預算法第62條之1", "會計法", "中央對各級地方政府重大天然災害救災經費處理辦法第8條"];

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
}

// "六十二" / "一百十" / "62" -> number (same rules as citation_resolver.chinese_to_arabic)
function toNumber(s) {
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    const digits = { 零: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
    const units = { 十: 10, 百: 100, 千: 1000 };
    let total = 0, digit = 0;
    for (const ch of s) {
        if (ch in digits) digit = digits[ch];
        else if (ch in units) { total += (digit || 1) * units[ch]; digit = 0; }
    }
    return total + digit;
}

// 62 -> "六十二", 110 -> "一百十" (Taiwanese statutes omit 一 before 十)
function toChinese(n) {
    const d = "零一二三四五六七八九";
    if (n < 10) return d[n];
    if (n < 20) return "十" + (n % 10 ? d[n % 10] : "");
    if (n < 100) return d[Math.floor(n / 10)] + "十" + (n % 10 ? d[n % 10] : "");
    const h = Math.floor(n / 100), r = n % 100;
    if (!r) return d[h] + "百";
    if (r < 10) return d[h] + "百零" + d[r];
    return d[h] + "百" + toChinese(r);
}

function nodeId(code, main, sub) {
    return `${code}-${String(main).padStart(4, "0")}` + (sub ? `-${String(sub).padStart(3, "0")}` : "");
}

function articleLabel(id) {
    const node = nodes.get(id);
    if (node) return node.article_zh;
    const [, main, sub] = id.match(/-(\d{4})(?:-(\d{3}))?$/) || [];
    return main ? `第 ${+main}${sub ? "-" + +sub : ""} 條` : id;
}

function lawName(code) { return codeToName[code] || code; }

// Free text -> { code, main, sub } (main null for a whole-law query)
function parseQuery(raw) {
    const text = raw.normalize("NFKC").replace(/\s+/g, "");
    if (!text) return null;
    const direct = text.toUpperCase().match(/^([A-Z0-9]+)-(\d{1,4})(?:-(\d{1,3}))?$/);
    if (direct && codeToName[direct[1]]) {
        return { code: direct[1], main: +direct[2], sub: direct[3] ? +direct[3] : null };
    }
    const name = sortedNames.find(n => text.includes(n));
    if (!name) return { error: `找不到法規名稱「${raw}」。請從輸入框的建議清單選一部法規。` };
    const num = "[0-9零一二三四五六七八九十百千兩]+";
    const m = text.replace(name, "").match(new RegExp(`(${num})[條點]?(?:[之\\-](${num}))?`));
    return {
        code: nameToCode[name],
        main: m ? toNumber(m[1]) : null,
        sub: m && m[2] ? toNumber(m[2]) : null,
    };
}

// Badges for all edges from one citing article (sub_refs listed once each)
function edgeBadges(edges) {
    const subRefs = [...new Set(edges.map(e => e.sub_ref).filter(Boolean))];
    const badges = subRefs.map(s => `<span class="badge">${escapeHtml(s)}</span>`);
    if (edges.some(e => e.kind === "relative")) badges.push(`<span class="badge">相對引用（前條／次條）</span>`);
    const review = edges.filter(e => e.needs_review);
    if (review.length) {
        const pct = Math.round(Math.min(...review.map(e => e.confidence)) * 100);
        badges.push(`<span class="badge review">需複核 ${pct}%</span>`);
    }
    return badges.join("");
}

// Mark "第六十二條" / "第62條" / "第五點" in the citing text
function highlight(text, main) {
    const html = escapeHtml(text);
    if (!main) return html;
    const forms = `(?:${main}|${toChinese(main)})`;
    return html.replace(new RegExp(`第\\s*${forms}\\s*[條點](?:之[一二三四五六七八九十]+)?`, "g"), "<mark>$&</mark>");
}

function citingCard(edges, targetMain) {
    const src = nodes.get(edges[0].source);
    if (!src) return "";
    const text = src.text || "";
    const long = text.length > 220;
    const body = `<p class="text">${highlight(long ? text.slice(0, 220) + "…" : text, targetMain)}</p>`
        + (long ? `<details><summary>展開全文</summary><p class="text">${highlight(text, targetMain)}</p></details>` : "");
    return `<div class="card">
        <div class="hit-head">
            <a href="#${encodeURIComponent(src.id)}">${escapeHtml(src.law_name)} ${escapeHtml(src.article_zh)}</a>
            <div class="badges">${edgeBadges(edges)}</div>
        </div>${body}</div>`;
}

function renderArticle(q) {
    const id = nodeId(q.code, q.main, q.sub);
    const target = nodes.get(id);
    const edges = incoming.get(id) || [];

    let html = `<div class="card target"><h2>${escapeHtml(lawName(q.code))} ${escapeHtml(articleLabel(id))}</h2>`;
    if (target) {
        html += `<p class="text">${escapeHtml(target.text)}</p>`;
    } else if (lawsInData.has(q.code)) {
        html += `<div class="warn">資料中沒有這一條（可能已刪除、改條號，或條號輸入錯誤）。${edges.length ? "下面的引用可能已經失效。" : ""}</div>`;
    } else {
        html += `<p class="muted">這部法規沒有收錄全文，只列出引用它的條文。</p>`;
    }
    const bySource = groupBySource(edges);
    html += `</div><h3>被 ${bySource.length} 條條文引用</h3>`;

    if (!bySource.length) return html + `<p class="empty">沒有其他條文引用這一條。</p>`;
    // Other laws first, then the same law; each in article order
    const own = id => id.startsWith(q.code + "-");
    bySource.sort((a, b) => (own(a[0].source) - own(b[0].source)) || a[0].source.localeCompare(b[0].source));
    return html + bySource.map(group => citingCard(group, q.main)).join("");
}

function groupBySource(edges) {
    const groups = new Map();
    edges.forEach(e => groups.set(e.source, [...(groups.get(e.source) || []), e]));
    return [...groups.values()];
}

function renderLaw(code) {
    const prefix = code + "-";
    const cited = [...incoming.entries()].filter(([id]) => id.startsWith(prefix))
        .sort(([a], [b]) => a.localeCompare(b));
    const total = cited.reduce((sum, [, es]) => sum + groupBySource(es).length, 0);

    let html = `<div class="card target"><h2>${escapeHtml(lawName(code))}</h2>
        <p class="muted">${cited.length} 條被引用，共 ${total} 處。點條號看是誰引用。</p></div>`;
    if (!cited.length) return html + `<p class="empty">這部法規沒有任何條文被引用。</p>`;

    return html + `<div class="card">` + cited.map(([id, es]) => {
        const missing = lawsInData.has(code) && !nodes.has(id);
        const groups = groupBySource(es);
        const fromOther = groups.filter(g => !g[0].source.startsWith(prefix)).length;
        return `<div class="article-row">
            <a href="#${encodeURIComponent(id)}">${escapeHtml(articleLabel(id))}</a>
            <span class="muted">${groups.length} 處${fromOther ? `（其他法規 ${fromOther}）` : ""}${missing ? ` <span class="badge review">資料中無此條</span>` : ""}</span>
        </div>`;
    }).join("") + `</div>`;
}

function run(raw) {
    const result = document.getElementById("result");
    const q = parseQuery(raw);
    if (!q) { result.innerHTML = `<p class="empty">輸入法規與條號開始查詢。</p>`; return; }
    if (q.error) { result.innerHTML = `<p class="warn">${escapeHtml(q.error)}</p>`; return; }
    result.innerHTML = q.main ? renderArticle(q) : renderLaw(q.code);
}

function runFromHash() {
    const raw = decodeURIComponent(location.hash.slice(1));
    document.getElementById("q").value = raw;
    run(raw);
}

async function init() {
    const data = await (await fetch("laws_graph.json")).json();
    data.nodes.forEach(n => { nodes.set(n.id, n); lawsInData.add(n.law_code); });
    data.edges.forEach(e => {
        if (!e.target) return;  // unresolved citations have nowhere to land
        if (!incoming.has(e.target)) incoming.set(e.target, []);
        incoming.get(e.target).push(e);
    });

    nameToCode = data.aliases || {};
    data.nodes.forEach(n => { nameToCode[n.law_name.normalize("NFKC")] = n.law_code; });
    // Display name: the law's own name if we have it, else its longest alias
    for (const [name, code] of Object.entries(nameToCode)) {
        if (name !== code && (!codeToName[code] || name.length > codeToName[code].length)) codeToName[code] = name;
    }
    data.nodes.forEach(n => { codeToName[n.law_code] = n.law_name; });
    sortedNames = Object.keys(nameToCode).sort((a, b) => b.length - a.length);

    document.getElementById("law-names").innerHTML = [...new Set(Object.values(codeToName))]
        .sort().map(n => `<option value="${escapeHtml(n)}">`).join("");
    document.getElementById("examples").innerHTML = EXAMPLES
        .map(x => `<button type="button" data-q="${escapeHtml(x)}">${escapeHtml(x)}</button>`).join("");

    runFromHash();
}

document.getElementById("query-form").addEventListener("submit", e => {
    e.preventDefault();
    location.hash = encodeURIComponent(document.getElementById("q").value.trim());
});
document.getElementById("examples").addEventListener("click", e => {
    if (e.target.dataset.q) location.hash = encodeURIComponent(e.target.dataset.q);
});
window.addEventListener("hashchange", runFromHash);

init().catch(err => {
    document.getElementById("result").innerHTML =
        `<p class="warn">讀不到 laws_graph.json（${escapeHtml(err.message)}）。請在專案目錄執行 <code>python3 run_server.py</code> 再開啟。</p>`;
});
</script>
</body>
</html>
